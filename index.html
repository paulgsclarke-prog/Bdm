<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BDM Starter</title>
  <style>
[hidden]{display:none!important}

:root{
  --bg:#f1f1ef;
  --panel:#ffffff;
  --ink:#20201e;
  --muted:#6d6d68;
  --blue:#65717b;
  --teal:#777e72;
  --green:#58715e;
  --amber:#d6a62a;
  --orange:#c98327;
  --red:#b84b43;
  --line:#deded8;
  --shadow:0 8px 22px rgba(25,25,22,.10);
  --brand:#0f4a43;
  --charcoal:#20201e;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}
button,input,textarea{font:inherit}
button{cursor:pointer}
.app-shell{max-width:720px;margin:0 auto;min-height:100vh;padding-bottom:92px}
.topbar{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:20px 20px 12px;background:rgba(245,247,246,.96);backdrop-filter:blur(8px)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--teal)}
h1{font-size:30px;margin:3px 0 0} h2{font-size:20px;margin:0}
.icon-btn{width:46px;height:46px;border:0;border-radius:15px;background:var(--panel);box-shadow:var(--shadow);font-size:24px;color:var(--ink)}
main{padding:8px 18px 24px}
.hero{background:linear-gradient(135deg,#dcefe9,#eef6f4);border-radius:28px;padding:24px;display:flex;align-items:end;justify-content:space-between;gap:16px;box-shadow:var(--shadow)}
.hero-number{font-size:54px;line-height:.95;font-weight:800}
.hero-label{margin-top:8px;color:#4f6560;max-width:190px;font-weight:600}
.primary-btn{border:0;border-radius:16px;padding:15px 18px;background:var(--ink);color:white;font-weight:800}
.stats-grid,.action-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.stat-card,.action-card{border:0;text-align:left;background:var(--panel);border-radius:22px;padding:18px;box-shadow:var(--shadow);color:var(--ink)}
.stat-card{border-top:5px solid var(--blue);min-height:132px}
.stat-card.urgent{border-color:var(--red)} .stat-card.warning{border-color:var(--amber)} .stat-card.positive{border-color:var(--teal)} .stat-card.neutral{border-color:var(--blue)}
.stat-card .big{display:block;font-size:34px;font-weight:800;margin-bottom:3px}
.stat-card span:not(.big){font-weight:800;display:block}.stat-card small,.action-card small{display:block;color:var(--muted);margin-top:5px}
.section{margin-top:28px}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.action-card span{display:block;font-size:28px;margin-bottom:14px}.action-card b{display:block}
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(720px,100%);display:grid;grid-template-columns:repeat(4,1fr);padding:10px 12px 14px;background:rgba(255,255,255,.96);border-top:1px solid var(--line);backdrop-filter:blur(8px);z-index:10}
.nav-btn{border:0;background:none;color:#83918d;padding:4px}.nav-btn span{display:block;font-size:23px;line-height:1}.nav-btn small{display:block;margin-top:5px}.nav-btn.active{color:var(--teal);font-weight:800}
.list{display:grid;gap:12px}.group-card,.report-card,.history-card,.customer-card,.form-card{background:var(--panel);border-radius:22px;padding:18px;box-shadow:var(--shadow)}
.group-card,.report-card{border:0;text-align:left;color:var(--ink);width:100%}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.badge{display:inline-block;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:800;background:#edf2f0;color:#48615a}
.badge.red{background:#fae8e8;color:#9d4040}.badge.amber{background:#edf3f1;color:#3e5e57}.badge.green{background:#e4f3e7;color:#397246}.badge.blue{background:#e8f0fa;color:#3f6389}
.metric{font-size:28px;font-weight:800}.muted{color:var(--muted)} .sub{font-size:13px;color:var(--muted)}
.customer-card h2{font-size:27px;margin-bottom:2px}.phone{display:block;margin:14px 0;background:#e6f3ef;border-radius:16px;padding:15px;text-align:center;font-size:22px;font-weight:800;color:#2c6f63;text-decoration:none}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fact{background:#f6f8f7;border-radius:16px;padding:12px}.fact b{display:block;font-size:17px}.fact small{color:var(--muted)}
.offer{margin-top:14px;padding:14px;border-radius:16px;background:#edf3f1;border:1px solid #d7e4e0}.offer b{display:block}
.progress{height:8px;background:#e7eeeb;border-radius:999px;overflow:hidden;margin:12px 0 20px}.progress > div{height:100%;background:var(--teal)}
.quick-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.quick-actions button,.wide-btn{border:0;border-radius:16px;padding:16px;font-weight:800;background:#edf2f0;color:var(--ink)}.quick-actions .good{background:#dff0eb;color:#28675d}.quick-actions .warn{background:#edf3f1;color:#3e5e57}.quick-actions .bad{background:#f8e6e6;color:#9a4242}.wide-btn{width:100%;margin-top:10px;background:var(--ink);color:white}
.field{margin-top:13px}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:6px;color:#50655f}.field input,.field textarea,.field select{width:100%;border:1px solid #dce5e1;border-radius:14px;padding:13px;background:white;color:var(--ink)}textarea{min-height:90px;resize:vertical}
.pill-row{display:flex;flex-wrap:wrap;gap:8px}.pill{border:1px solid #dce5e1;background:white;border-radius:999px;padding:10px 12px}.pill.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.success{padding:16px;border-radius:18px;background:#e2f3ea;color:#2d6a50;font-weight:800;margin-bottom:15px}
@media (max-width:430px){.hero{align-items:stretch;flex-direction:column}.primary-btn{width:100%}.stats-grid,.action-grid{grid-template-columns:1fr 1fr}.facts{grid-template-columns:1fr 1fr}}

.file-drop{display:block;border:2px dashed #cddbd6;border-radius:20px;padding:24px;text-align:center;background:#fbfcfc;margin-top:14px}
.file-drop input{display:none}
.file-drop b{display:block;font-size:18px;margin-bottom:4px}
.import-status{margin-top:14px;padding:14px;border-radius:16px;background:#eef5f3;color:#345f56}
.import-status.error{background:#f8e7e7;color:#8d4242}
.snapshot-card{background:#fff;border-radius:18px;padding:14px 16px;box-shadow:var(--shadow);margin-top:10px}
.snapshot-card .row{align-items:flex-start}
.kpi-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.kpi-mini{background:#f4f7f6;border-radius:14px;padding:10px;text-align:center}
.kpi-mini b{display:block;font-size:20px}
.kpi-mini small{color:var(--muted)}

/* V3 mobile dashboard */
.dashboard-block{margin-top:18px}
.dashboard-title{font-size:15px;font-weight:800;color:var(--muted);margin:0 0 10px 2px}
.kpi-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi-card{background:var(--panel);border:0;border-radius:20px;padding:16px;text-align:left;box-shadow:var(--shadow);color:var(--ink);min-height:108px}
.kpi-card .kpi-value{font-size:29px;line-height:1;font-weight:850;display:block;margin-bottom:7px}
.kpi-card .kpi-label{font-size:14px;font-weight:800;display:block}
.kpi-card .kpi-sub{font-size:12px;color:var(--muted);margin-top:4px;display:block}
.kpi-card.alert{border-left:5px solid var(--red)}
.kpi-card.warn{border-left:5px solid var(--amber)}
.kpi-card.good{border-left:5px solid var(--teal)}
.kpi-card.blue{border-left:5px solid var(--blue)}
.lead-summary{display:grid;grid-template-columns:1fr;gap:10px}
.lead-row{background:var(--panel);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow)}
.lead-row .bar-wrap{height:9px;background:#edf2f0;border-radius:999px;overflow:hidden;margin-top:9px}
.lead-row .bar{height:100%;background:var(--teal);border-radius:999px}
.top-summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.top-summary .summary-tile{background:rgba(255,255,255,.8);border-radius:18px;padding:14px}
.summary-tile b{font-size:24px;display:block}
.summary-tile small{color:var(--muted)}
.lead-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.badge.overdue{background:#fae8e8;color:#9d4040}
.badge.today{background:#edf3f1;color:#3e5e57}
.badge.open{background:#e8f0fa;color:#3f6389}
@media (max-width:520px){
  .app-shell{max-width:none}
  .topbar{padding:15px 14px 10px}
  main{padding:6px 12px 20px}
  h1{font-size:26px}
  .hero{border-radius:22px;padding:18px}
  .hero-number{font-size:46px}
  .stats-grid,.action-grid,.kpi-grid{grid-template-columns:1fr 1fr;gap:9px}
  .stat-card,.action-card,.kpi-card{border-radius:18px;padding:14px}
  .stat-card{min-height:118px}
  .action-card{min-height:110px}
  .customer-card,.form-card,.group-card,.report-card,.history-card{border-radius:18px;padding:15px}
  .phone{font-size:20px}
  .bottom-nav{padding-bottom:max(12px,env(safe-area-inset-bottom))}
}
@media (max-width:360px){
  .kpi-grid,.stats-grid,.action-grid{grid-template-columns:1fr}
  .facts,.lead-form-grid{grid-template-columns:1fr}
}

/* V4 */
.period-banner{background:var(--ink);color:#fff;border-radius:22px;padding:17px 18px;margin-bottom:12px;box-shadow:var(--shadow)}
.period-banner .period-code{font-size:28px;font-weight:900}.period-banner .period-dates{font-size:12px;opacity:.72;margin-top:3px}.action-lanes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}.action-lane{border:0;border-radius:22px;padding:18px;text-align:left;box-shadow:var(--shadow);color:var(--ink);min-height:155px}.action-lane.follow{background:#eef4f2;border-bottom:5px solid #6d8e86}.action-lane.calls{background:#e7f3f0;border-bottom:5px solid var(--teal)}.action-lane .lane-icon{font-size:28px;display:block;margin-bottom:10px}.action-lane .lane-value{font-size:35px;line-height:1;font-weight:900;display:block}.action-lane .lane-label{display:block;font-size:16px;font-weight:850;margin-top:7px}.action-lane .lane-sub{display:block;font-size:12px;color:var(--muted);margin-top:4px}.period-table{display:grid;gap:9px}.period-row{background:var(--panel);border-radius:18px;padding:14px 15px;box-shadow:var(--shadow)}.period-row.current{border-left:5px solid var(--teal)}.period-row .period-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.period-row .period-name{font-weight:900}.period-row .period-values{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.period-row .period-values div{background:#f5f8f7;border-radius:12px;padding:9px}.period-row .period-values b{display:block;font-size:16px}.period-row .period-values small{color:var(--muted);font-size:11px}.category-grid{display:grid;grid-template-columns:1fr;gap:8px}.category-row{background:var(--panel);border-radius:17px;padding:13px 14px;box-shadow:var(--shadow)}.category-row .category-stats{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px}.category-row .category-stats span{font-size:12px;color:var(--muted)}.category-row .category-stats b{color:var(--ink)}.lead-period{font-size:12px;font-weight:800;color:var(--teal)}
@media(max-width:420px){.action-lanes{grid-template-columns:1fr 1fr}.action-lane{padding:15px;min-height:145px}.action-lane .lane-value{font-size:32px}.period-row .period-values{grid-template-columns:1fr 1fr 1fr}}
@media(max-width:340px){.action-lanes{grid-template-columns:1fr}}

/* V5 navigation + settings */
.settings-card{background:var(--panel);border-radius:20px;padding:16px;box-shadow:var(--shadow);margin-top:12px}
.message-card{background:#eef6f3;border:1px solid #dcebe6;border-radius:18px;padding:14px;margin-top:10px}
.message-card b{display:block;margin-bottom:4px}
.call-category-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.call-category{border:0;border-radius:20px;padding:16px;text-align:left;box-shadow:var(--shadow);background:var(--panel);color:var(--ink);min-height:125px}
.call-category .count{font-size:31px;font-weight:900;display:block}
.call-category .name{font-weight:850;display:block;margin-top:5px}
.call-category .msg{font-size:12px;color:var(--muted);display:block;margin-top:5px}
.toolbar{display:flex;gap:8px;overflow:auto;padding-bottom:3px;margin-bottom:12px}
.filter-btn{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:9px 12px;white-space:nowrap;color:var(--ink);font-weight:750}
.filter-btn.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.stat-section{margin-top:18px}
.stat-section-title{font-size:14px;font-weight:850;color:var(--muted);margin:0 0 9px 2px}
.metric-stack{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.metric-box{background:var(--panel);border-radius:18px;padding:15px;box-shadow:var(--shadow)}
.metric-box b{font-size:28px;display:block;line-height:1.05}
.metric-box span{font-size:13px;font-weight:800;display:block;margin-top:6px}
.metric-box small{color:var(--muted);display:block;margin-top:3px}
.small-note{font-size:11px;color:var(--muted)}
.setting-row{margin-top:12px}
.setting-row label{font-size:12px;font-weight:800;display:block;margin-bottom:5px;color:var(--muted)}
.setting-row textarea,.setting-row input{width:100%;border:1px solid #dce5e1;border-radius:14px;padding:12px;background:#fff;color:var(--ink)}
.settings-actions{display:flex;gap:8px;margin-top:12px}
.settings-actions button{flex:1;border:0;border-radius:14px;padding:12px;font-weight:850}
.settings-actions .save{background:var(--ink);color:#fff}
.settings-actions .close{background:#edf2f0;color:var(--ink)}
.header-tools{display:flex;gap:8px;align-items:center}
@media (max-width:420px){
  .call-category-grid,.metric-stack{grid-template-columns:1fr 1fr}
}
@media (max-width:340px){
  .call-category-grid,.metric-stack{grid-template-columns:1fr}
}

/* V6 HANDSOME trade theme + multi-user PIN */
body{background:#efefec}
.topbar{background:rgba(32,32,30,.97);color:#fff;border-bottom:4px solid #0f4a43}
.eyebrow{color:#d8d8d3}
.topbar h1{color:#fff}
.brand-block{min-width:0}
.brand-word{display:inline-block;background:#0f4a43;color:#fff;font-weight:950;letter-spacing:.12em;padding:5px 8px;border-radius:3px;font-size:13px}
.icon-btn{background:#343431;color:#fff;box-shadow:none;border:1px solid #4a4a46}
.bottom-nav{background:#20201ef5;border-top:3px solid #0f4a43}
.nav-btn{color:#bbbcb6}
.nav-btn.active{color:#b8d0ca}
.primary-btn,.wide-btn,.filter-btn.active,.settings-actions .save{background:var(--charcoal);color:#fff}
.stat-card,.kpi-card,.action-card,.group-card,.call-category,.history-card,.form-card,.settings-card,.report-card{border:1px solid #e4e4df}
.period-banner{background:#20201e;border-top:4px solid var(--brand)}
.badge.green{background:#e4efe7;color:#385742}
.badge.amber{background:#edf3f1;color:#3e5e57}
.badge.red{background:#f7e4e2;color:#843b35}
.badge.blue{background:#e8eaec;color:#4a555f}
.manager-only{display:none}
body.manager-session .manager-only{display:block!important}
body.manager-session .bottom-nav{grid-template-columns:repeat(5,1fr)}
body:not(.manager-session) .bottom-nav{grid-template-columns:repeat(4,1fr)}
.nav-btn small{font-size:10px}
.user-chip{display:inline-flex;align-items:center;gap:7px;background:#343431;color:#fff;border:1px solid #494944;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:800}
.user-chip .manager-star{color:#b8d0ca}
.audit-line{margin-top:10px;padding-top:9px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}
.audit-line b{color:var(--ink)}
.user-list{display:grid;gap:10px;margin-top:12px}
.user-card{background:#fff;border:1px solid #e2e2dd;border-radius:17px;padding:13px 14px}
.user-card .role{font-size:11px;font-weight:850;color:#6d6d68}
.manager-summary{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.manager-user-card{background:#fff;border-radius:18px;padding:14px;border:1px solid #e2e2dd;box-shadow:var(--shadow)}
.manager-user-card h3{margin:0 0 8px;font-size:17px}
.manager-user-card .mini-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.manager-user-card .mini{background:#f5f5f2;border-radius:11px;padding:8px}
.manager-user-card .mini b{display:block;font-size:17px}
.manager-user-card .mini small{font-size:10px;color:var(--muted)}
.pin-modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.64);display:flex;align-items:flex-end;justify-content:center;padding:0}
.pin-modal.hidden{display:none}
.pin-sheet{width:min(520px,100%);background:#f4f4f1;border-radius:26px 26px 0 0;padding:20px 18px max(20px,env(safe-area-inset-bottom));box-shadow:0 -10px 30px rgba(0,0,0,.25)}
.pin-brand{display:inline-block;background:#0f4a43;color:#fff;font-weight:950;letter-spacing:.12em;padding:5px 8px;border-radius:3px;font-size:12px;margin-bottom:12px}
.pin-sheet h2{margin:0 0 3px;font-size:24px}
.pin-user-row{margin-top:14px}
.pin-user-row select{width:100%;padding:13px;border-radius:14px;border:1px solid #d5d5cf;background:#fff;font-weight:800}
.pin-dots{display:flex;justify-content:center;gap:16px;margin:22px 0 14px}
.pin-dots span{width:16px;height:16px;border:2px solid #777;border-radius:50%;background:transparent}
.pin-dots span.filled{background:#20201e;border-color:#20201e}
.pin-error{min-height:18px;text-align:center;color:var(--red);font-size:12px;font-weight:800}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:8px}
.pin-pad button{height:58px;border:0;border-radius:16px;background:#fff;font-size:22px;font-weight:850;color:#20201e;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.pin-pad button:active{transform:scale(.98);background:#ecece7}
.pin-cancel{width:100%;margin-top:10px;border:0;background:transparent;padding:12px;color:#6d6d68;font-weight:800}
.user-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.permission-toggle{display:flex;align-items:center;justify-content:space-between;background:#f5f5f2;border-radius:14px;padding:12px;margin-top:10px}
.permission-toggle input{width:22px;height:22px}
.call-owner-note{font-size:11px;color:var(--muted);margin-top:4px}
@media (max-width:420px){
  .pin-sheet{padding-left:14px;padding-right:14px}
  .pin-pad button{height:56px}
  .manager-summary{grid-template-columns:1fr}
  body.manager-session .nav-btn small{font-size:9px}
}

:root{
  --deep-green:#0f4a43;
  --mid-green:#3e6f66;
  --pale-green:#e9f0ee;
  --soft-grey:#f2f3f1;
}
.topbar{background:#1f2523}
.brand-word{background:var(--deep-green);color:#fff;letter-spacing:.10em}
.bottom-nav{background:#1f2523f5;border-top-color:var(--deep-green)}
.nav-btn.active{color:#b7d0ca}
.period-banner{background:#1f2523;border-top:4px solid var(--deep-green)}
.primary-btn,.wide-btn,.filter-btn.active,.settings-actions .save{background:var(--deep-green)}
.badge.amber,.badge.today{background:#edf3f1;color:#3e5e57}
.action-lane.follow{background:#eef4f2;border-bottom-color:#6d8e86}
.action-lane.calls{background:#e7f0ed;border-bottom-color:#3e6f66}
.pin-brand{background:var(--deep-green);color:#fff}
.manager-star{color:#b7d0ca}
.priority-list{display:grid;gap:8px;margin-top:12px}
.priority-item{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;background:#fff;border:1px solid #dde4e1;border-radius:16px;padding:12px}
.priority-rank{width:32px;height:32px;border-radius:10px;background:#e8efed;display:flex;align-items:center;justify-content:center;font-weight:900;color:#2f5c54}
.priority-text b{display:block;font-size:14px}
.priority-text small{display:block;color:var(--muted);margin-top:2px}
.priority-controls{display:flex;gap:5px}
.priority-controls button{width:34px;height:34px;border:0;border-radius:10px;background:#edf1ef;color:#2d4741;font-weight:900}
.analytics-bars{display:grid;gap:8px}
.analytics-row{display:grid;grid-template-columns:62px 1fr 46px;gap:8px;align-items:center}
.analytics-row .bar-track{height:12px;background:#e5e8e6;border-radius:999px;overflow:hidden}
.analytics-row .bar-fill{height:100%;background:#3e6f66;border-radius:999px}
.analytics-row .bar-fill.success{background:#0f4a43}
.duration-quick{display:flex;flex-wrap:wrap;gap:7px;margin-top:7px}
.duration-quick button{border:1px solid #dce4e1;background:#fff;border-radius:999px;padding:8px 10px;font-weight:800;color:#365b54}
.duration-quick button.active{background:#0f4a43;color:#fff;border-color:#0f4a43}

/* =========================================================
   V9 — HANDSOME / Howdens-inspired trade theme

   red #D22630, black #000000, grey #646363, white #FFFFFF,
   cream #F5F0E3, dark blue-grey #28343C.

:root{

  --panel:#FFFFFF;
  --ink:#000000;
  --muted:#646363;
  --blue:#28343C;
  --teal:#646363;
  --green:#646363;
  --amber:#646363;
  --orange:#D22630;
  --red:#D22630;
  --line:#D7D4CC;
  --shadow:0 2px 8px rgba(0,0,0,.10);
  --brand:#D22630;
  --charcoal:#000000;
  --deep-green:#000000;
  --mid-green:#646363;
  --pale-green:#F1F1EF;
  --soft-grey:#F1F1EF;
}

body{
  background:#F5F0E3;
  color:#000;
}

.app-shell{
  background:#F5F0E3;
}

  backdrop-filter:none;
}
.brand-word{
  background:transparent;
  color:#000;
  padding:0;
  border-radius:0;
  font-size:20px;
  line-height:1;
  font-weight:950;
  letter-spacing:.035em;
  position:relative;
}
.brand-word::after{
  content:"";
  display:block;
  width:38px;
  height:4px;
  background:#D22630;
  margin-top:5px;
}
.eyebrow{
  color:#646363;
  font-weight:700;
  letter-spacing:.08em;
  margin-top:6px;
}
.topbar h1{
  color:#000;
}
.icon-btn{
  background:#F1F1EF;
  border:1px solid #D0CEC7;
  color:#000;
  box-shadow:none;
  border-radius:4px;
}

/* Main navigation */
.bottom-nav{

  border-top:2px solid #000;
  box-shadow:0 -2px 8px rgba(0,0,0,.08);

}

}

}

}

.group-card,.report-card,.history-card,.customer-card,.form-card,
.settings-card,.snapshot-card,.call-category,.manager-user-card,
.metric-box,.user-card{

.pin-sheet{

}
.pin-brand{
  background:transparent;
  color:#000;
  padding:0;

}
.pin-brand::after{

}
.pin-dots span.filled{
  background:#D22630;

.pin-pad button{

}
.pin-pad button:active{
  background:#D22630;
  color:#FFF;
}

/* User / manager */
.user-chip{
  background:#FFF;
  color:#000;
  border:1px solid #C9C7C0;
  border-radius:3px;
}
.manager-star{
  color:#D22630;
}

/* Call duration */
.duration-quick button{
  border-radius:3px;
  color:#000;
  border:1px solid #AFAEAA;
}
.duration-quick button.active{
  background:#D22630;
  color:#FFF;
  border-color:#D22630;
}

/* Success and import states */
.success{
  background:#F1F1EF;
  color:#000;
  border-left:5px solid #28343C;
  border-radius:4px;

  border-left-color:#D22630;
}
.file-drop{
  background:#FFF;
  border:2px dashed #646363;
  border-radius:4px;

/* Remove remaining overly rounded visual language */
.pill,.required-chip,.user-chip,.badge{
  border-radius:3px;
}
.bar-wrap,.bar,.bar-track,.bar-fill,.progress,.progress>div{

@media (max-width:520px){
  .topbar{padding-top:14px}

  .history-card,.kpi-card,.stat-card,.action-card,.call-category{
    border-radius:5px;

/* V10 workflow / targets / manager intelligence */
.stage-badge{display:inline-block;padding:5px 8px;border-radius:3px;font-size:11px;font-weight:900;background:#ECECEC;color:#000}
.stage-open{background:#E7E7E7}
.stage-contacted{background:#D9DEE0}
.stage-quoted{background:#D7E0E5}
.stage-awaiting{background:#E7E1D8}

.intervention-card small{color:var(--muted)}
.score-pill{display:inline-block;min-width:46px;text-align:center;padding:5px 7px;background:#28343C;color:#fff;font-weight:900;border-radius:3px}

.metric-table{width:100%;border-collapse:collapse;background:#fff;border:1px solid #D7D4CC}
.metric-table th,.metric-table td{padding:10px;border-bottom:1px solid #E1DFD8;text-align:left;font-size:12px}
.metric-table th{background:#F1F1EF;font-weight:900}
.metric-table tr:last-child td{border-bottom:0}
.segment-tabs{display:flex;gap:7px;overflow:auto;margin-bottom:10px}
.segment-tabs button{border:1px solid #AFAEAA;background:#fff;padding:8px 10px;border-radius:3px;white-space:nowrap;font-weight:800}
.segment-tabs button.active{background:#000;color:#fff}
.reason-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.reason-grid button{border:1px solid #CFCFC8;background:#fff;border-radius:3px;padding:10px;text-align:left;font-size:12px;font-weight:800}
.reason-grid button.active{background:#28343C;color:#fff}
.best-time{display:inline-block;padding:5px 8px;background:#F1F1EF;border-left:4px solid #D22630;font-size:12px;font-weight:800}
@media (max-width:420px){
  .target-grid{grid-template-columns:1fr 1fr}
  .metric-table th,.metric-table td{padding:8px;font-size:11px}
}

.quick-note-grid{display:grid;grid-template-columns:1fr;gap:7px;margin-top:6px}
.quick-note-btn{width:100%;text-align:left;border:1px solid #CFCFC8;background:#FFF;color:#000;padding:11px 12px;border-radius:4px;font-size:12px;font-weight:800;line-height:1.3}
.quick-note-btn.active{background:#28343C;color:#FFF;border-color:#28343C}
.quick-note-btn:active{border-color:#D22630}
@media(min-width:520px){.quick-note-grid{grid-template-columns:1fr 1fr}}

.nurture-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.nurture-card{background:#fff;border:1px solid #d7d4cc;border-left:5px solid #28343c;border-radius:5px;padding:14px;text-align:left;color:#000}
.nurture-card.priority{border-left-color:#d22630}.nurture-card.danger{border-left-color:#d22630}
.nurture-card b{font-size:26px;display:block}.nurture-card span{display:block;font-weight:900;margin-top:3px}.nurture-card small{display:block;color:#646363;margin-top:3px}
.why-call{background:#28343c;color:#fff;border-left:6px solid #d22630;padding:12px;margin:-1px -1px 14px;border-radius:4px 4px 0 0}
.why-call small,.why-call b,.why-call span{display:block}.why-call small{font-size:10px;letter-spacing:.08em;opacity:.8}.why-call b{font-size:16px;margin-top:3px}.why-call span{font-size:12px;margin-top:4px}
.workflow-detail{margin-top:10px;padding:11px;background:#f1f1ef;border-left:4px solid #28343c}.workflow-detail.danger{border-left-color:#d22630}.workflow-detail b,.workflow-detail span{display:block}.workflow-detail span{font-size:12px;color:#646363;margin-top:4px}
.streak-strip{display:flex;justify-content:space-between;margin-top:10px;padding:10px 12px;background:#fff;border:1px solid #d7d4cc}

/* Keep each row of call cards aligned, including wrapping labels. */

  <script>
(async function(){
// Inlined into index.html: the frontend remains a single HTML file.
const cloud={enabled:false,initialising:true,member:null,data:{},revision:0,pending:false,blocked:false,inFlight:null,timer:null,
  banner(message){document.getElementById('cloudStatus').textContent=message;},
  download(data,suffix='backup'){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify({app:'HANDSOME BDM',version:1,exportedAt:new Date().toISOString(),data},null,2)],{type:'application/json'}));a.href=url;a.download='bdm-'+suffix+'-'+Date.now()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);},
  get(key,fallback){if(key==='bdm_active_user')return this.member.userId;if(key==='bdm_manager_session')return null;return Object.hasOwn(this.data,key)?structuredClone(this.data[key]):(['bdm_activity','bdm_leads','bdm_snapshots'].includes(key)?[]:fallback);},
  set(key,value){if(['bdm_active_user','bdm_manager_session'].includes(key))return;if(this.blocked)throw Error('Shared saving is paused. Download your pending changes before reloading.');this.data[key]=structuredClone(value);this.pending=true;this.banner('Saving changes…');clearTimeout(this.timer);this.timer=setTimeout(()=>this.flush().catch(()=>{}),200);},
  async request(method='GET',body){const token=await Clerk.session?.getToken();if(!token)throw Error('Your session ended. Download pending changes and sign in again.');const r=await fetch('/api/shared',{method,cache:'no-store',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{})});let json;try{json=await r.json();}catch{throw Error('The server could not confirm your save. Please retry.');}if(!r.ok){const e=Error(json.error||'Shared data request failed');e.status=r.status;throw e;}return json;},
  async flush(){if(this.inFlight){await this.inFlight;if(this.pending&&!this.blocked)return this.flush();return;}if(!this.pending||this.blocked)return;const data=structuredClone(this.data);this.pending=false;this.inFlight=(async()=>{try{const saved=await this.request('PUT',{revision:this.revision,data});this.revision=saved.revision;this.banner(this.pending?'Saving changes…':'All changes saved');}catch(e){this.pending=true;if(e.status===409||e.status===403||e.status===401)this.blocked=true;this.banner('Changes NOT saved: '+e.message);throw e;}})();try{await this.inFlight;}finally{this.inFlight=null;}if(this.pending&&!this.blocked)return this.flush();},
  async init(){
    const shell=document.querySelector('.app-shell');shell.hidden=true;
    const gate=document.createElement('section');gate.id='cloudGate';gate.style.cssText='max-width:480px;margin:40px auto;padding:24px';gate.innerHTML='<h1 style="color:#0f4a43">BDM</h1><p id="cloudGateStatus" role="status">Connecting…</p><div id="cloudLogin"></div>';document.body.prepend(gate);

    try{
      const r=await fetch('/api/config',{cache:'no-store'});if(!r.ok)throw Error('Unable to load BDM. Please refresh.');const config=await r.json();

const SALES_PERIOD_START = new Date(2025,11,29);
function localDateOnly(value){ if(!value)return null; if(typeof value==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(value)){const [y,m,d]=value.split('-').map(Number);return new Date(y,m-1,d);}const d=value instanceof Date?value:new Date(value);return Number.isNaN(d.getTime())?null:new Date(d.getFullYear(),d.getMonth(),d.getDate()); }
function recordDateKey(value){const date=localDateOnly(value);return date?workingDayKey(date):'';}
function daysBetween(a,b){ return Math.floor((Date.UTC(b.getFullYear(),b.getMonth(),b.getDate())-Date.UTC(a.getFullYear(),a.getMonth(),a.getDate()))/86400000); }
function periodInfo(value=new Date()){ const d=localDateOnly(value)||localDateOnly(new Date()); const diff=daysBetween(SALES_PERIOD_START,d); if(diff<0)return {period:0,week:0,day:0,label:'Before P1',start:null,end:null}; const pi=Math.floor(diff/28),within=diff%28,week=Math.floor(within/7)+1,day=within%7+1; const start=new Date(SALES_PERIOD_START); start.setDate(start.getDate()+pi*28); const end=new Date(start); end.setDate(end.getDate()+27); return {period:pi+1,week,day,label:`D${day} · W${week} · P${pi+1}`,start,end}; }
function fmtShortDate(d){ return d?d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}):'—'; }

function dashboardMetrics(){
  const p=periodInfo(new Date());
  const startISO=`${p.start.getFullYear()}-${String(p.start.getMonth()+1).padStart(2,'0')}-${String(p.start.getDate()).padStart(2,'0')}`;
  const endISO=`${p.end.getFullYear()}-${String(p.end.getMonth()+1).padStart(2,'0')}-${String(p.end.getDate()).padStart(2,'0')}`;
  const periodActs=activity.filter(a=>{
    const iso=recordDateKey(a.iso);
    return iso && iso>=startISO && iso<=endISO;
  });
  const spoken=periodActs.filter(a=>a.type==='Spoke to customer');
  const contactedIds=new Set(periodActs.filter(a=>['Spoke to customer','Voicemail left','No answer','Quote given'].includes(a.type)).map(a=>a.customerId || a.customer));
  const latest=latestSnapshot();
  const groups=liveGroups();
  const baseCustomerCount = latest?.customers?.length || Object.values(groups).flat().length || 0;
  const contactPct = baseCustomerCount ? Math.round(contactedIds.size/baseCustomerCount*100) : 0;

  const salesPeriodLeads=leads.filter(l=>leadRequiredPeriod(l)===p.period && l.status!=='lost');
  const leadValue=salesPeriodLeads.reduce((s,l)=>s+n(l.value),0);
  const leadMargin=salesPeriodLeads.reduce((s,l)=>s+n(l.margin),0);
  const marginPct=leadValue ? leadMargin/leadValue*100 : 0;

  const today=isoToday();
  const openLeads=leads.filter(l=>l.status!=='won' && l.status!=='lost');
  const followToday=openLeads.filter(l=>l.followUpDate===today);
  const overdue=openLeads.filter(l=>l.followUpDate && l.followUpDate<today);

  const callsMade=periodActs.filter(a=>['Spoke to customer','Voicemail left','No answer','Quote given'].includes(a.type)).length;
  const voicemail=periodActs.filter(a=>a.type==='Voicemail left').length;
  const conversations=periodActs.filter(a=>a.type==='Spoke to customer' || a.type==='Quote given').length;
  const successRate=callsMade ? conversations/callsMade*100 : 0;
  const generatedPeriodLeads=leads.filter(l=>{const date=recordDateKey(l.createdAt||l.audit?.iso);return date&&date>=startISO&&date<=endISO;});
  const generatedLeadValue=generatedPeriodLeads.reduce((sum,l)=>sum+n(l.value),0);
  const generatedLeadMargin=generatedPeriodLeads.reduce((sum,l)=>sum+n(l.margin),0);
  const generatedMarginPct=generatedLeadValue?generatedLeadMargin/generatedLeadValue*100:0;
  const spokenCustomerIds=new Set(periodActs.filter(a=>['Spoke to customer','Quote given'].includes(a.type)).map(a=>String(a.customerId||a.customer)));
  const leadCustomerIds=new Set(generatedPeriodLeads.map(l=>String(l.customerId||l.customer)));
  const leadStrike=spokenCustomerIds.size?[...spokenCustomerIds].filter(id=>leadCustomerIds.has(id)).length/spokenCustomerIds.size*100:0;
  const converted=generatedPeriodLeads.filter(l=>l.status==='won');
  const conversionRate=generatedPeriodLeads.length ? converted.length/generatedPeriodLeads.length*100 : 0;
  const dueTasks=followups.filter(f=>!f.completedAt&&f.date&&f.date<=today);

  const now=new Date();
  const weekStart=new Date(p.start);
  weekStart.setDate(weekStart.getDate()+(p.week-1)*7);
  const weekEnd=new Date(weekStart); weekEnd.setDate(weekEnd.getDate()+6);
  const weekStartISO=`${weekStart.getFullYear()}-${String(weekStart.getMonth()+1).padStart(2,'0')}-${String(weekStart.getDate()).padStart(2,'0')}`;
  const weekEndISO=`${weekEnd.getFullYear()}-${String(weekEnd.getMonth()+1).padStart(2,'0')}-${String(weekEnd.getDate()).padStart(2,'0')}`;
  const weekLeads=leads.filter(l=>{
    const created=recordDateKey(l.createdAt||l.audit?.iso);
    return created && created>=weekStartISO && created<=weekEndISO;
  });
  const weekLeadValue=weekLeads.reduce((s,l)=>s+n(l.value),0);
  const weekLeadMargin=weekLeads.reduce((s,l)=>s+n(l.margin),0);

  return {
    period:p.period, week:p.week, day:p.day,
    contactPct, contacted:contactedIds.size, customerCount:baseCustomerCount,
    callsMade, voicemail, conversations, successRate,
    leadStrike, conversionRate,
    leadCount:salesPeriodLeads.length, leadValue, leadMargin, marginPct,
    generatedLeadCount:generatedPeriodLeads.length,generatedLeadValue,generatedLeadMargin,generatedMarginPct,
    taskFollowToday:dueTasks.filter(f=>f.date===today).length,taskOverdue:dueTasks.filter(f=>f.date<today).length,
    weekLeadCount:weekLeads.length, weekLeadValue, weekLeadMargin,
    followToday:followToday.length, overdue:overdue.length
  };
}

  return [...unique.values()].filter(c=>c.salesYTD>0).sort((a,b)=>b.salesYTD-a.salesYTD || a.customer.localeCompare(b.customer)).slice(0,20);
}
function ytdColumns(rows){
  const norm=v=>String(v??'').toLowerCase().replace(/[^a-z0-9]/g,'');
  for(let i=0;i<Math.min(rows.length,30);i++){
    const heads=(rows[i]||[]).map(norm);
    const customer=heads.findIndex(h=>['customer','customerno','customernumber','customeraccount','account','accountno','accountnumber','accountcode','customercode'].includes(h));
    let sales=heads.findIndex(h=>h.includes('ytd') && (h.includes('sales')||h.includes('spend')||h==='ytd'));
    if(sales<0) sales=heads.findIndex(h=>h.includes('yeartodate') && (h.includes('sales')||h.includes('spend')||h==='yeartodate'));
    if(sales<0) sales=heads.findIndex(h=>['sales','salesvalue','salesamount','netsales','turnover','spend'].includes(h));
    const name=heads.findIndex(h=>['name','customername','accountname'].includes(h));
    if(customer>=0 && sales>=0) return {header:i,customer,sales,name};
  }
  return null;
}
function parseYtdRows(rows,columns){
  const customers=[];
  for(const row of rows.slice(columns.header+1)){
    const customer=String(row[columns.customer]??'').trim();
    if(/^(grand\s*total|total|subtotal)$/i.test(customer)) continue;
    if(!row.some(v=>v!=null&&String(v).trim()))continue;
    if(!customer)throw new Error('YTD report contains a row without an account.');
    const value=row[columns.sales],numeric=String(value??'').replace(/[£$,\s()]/g,'');
    if(!numeric||!Number.isFinite(Number(numeric)))throw new Error('Missing or invalid YTD sales for account '+customer);
    customers.push({customer,name:columns.name>=0?String(row[columns.name]??'').trim():'',salesYTD:reportNumber(row[columns.sales])});
  }
  return customers;
}
async function handleYtdImport(ev){
  const file=ev.target.files[0], status=document.getElementById('ytdImportStatus');
  if(!file) return;
  try{
    if(typeof XLSX==='undefined') throw new Error('Spreadsheet reader did not load. Please refresh and try again.');
    const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});
    let found=null;
    for(const sheet of wb.SheetNames){
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[sheet],{header:1,defval:null,raw:true});
      const columns=ytdColumns(rows);
      if(columns){found={customers:parseYtdRows(rows,columns),sheet};break;}
    }
    if(!found?.customers.length) throw new Error('No customer and YTD sales columns found. Use account/customer number and Sales YTD (or Sales in a YTD report).');
    ytdReport={...found,filename:file.name,date:isoToday()};
    storage.set('bdm_ytd_report',ytdReport);
    renderSettings();
  }catch(err){status.textContent=String(err.message||err);status.className='import-status error';}
}

function workflowForCustomer(c){
  const id=String(c.customer||'').trim();
  const rec=n(c.recency), tx=n(c.transactionsMAT), daysOpen=daysOpenForCustomer(c), prog=nurtureRecord(id);
  if(top20Set().has(id) && normalContactDue(id)) return {key:'top20',label:'TOP 20 CUSTOMER',reason:nurtureSettings.top20Message,rank:1};
  if(daysOpen<60 && tx<3 && prog.newContacts<4) return {key:'newNurture',label:`NEW ACCOUNT · CONTACT ${prog.newContacts+1} OF 4`,reason:nurtureSettings.newOffers[prog.newContacts]||'New account nurture',rank:2};
  if(rec>=12 && rec<15){

    let due=true;
    if(prog.lastOldContact){
      const d=localDateOnly(prog.lastOldContact);
      if(d) due=daysBetween(d,localDateOnly(new Date()))>=n(nurtureSettings.oldSpacingDays||18);

  }
  const spend=recentSpend30(id);
  const handled=prog.thanksHandledThrough;
  const latest=recentTxFor(id)[0]?.date || null;
  if(spend>=n(nurtureSettings.thanksThreshold) && latest && (!handled || latest>handled))
    return {key:'thanks',label:`GIVEN THANKS · ${money(spend)} / 30 DAYS`,reason:'Thank customer, check everything went well and ask about more business',rank:4};

}
function todaysUserMetrics(userId){

  const leadIds=new Set(leads.filter(l=>l.audit?.userId===userId && recordDateKey(l.createdAt)===today).map(l=>l.id));

function targetStatus(userId){
  const actual=todaysUserMetrics(userId);
  const config=dailyTargetFor(userId);
  const targets=config.targets;
  const enabled=config.enabled;
  const keys=['calls','conversations','leads','surveys'].filter(k=>enabled[k] && n(targets[k])>0);
  const achieved=keys.filter(k=>actual[k]>=n(targets[k]));
  return {actual,targets,enabled,keys,achieved,complete:keys.length>0&&achieved.length===keys.length};
}
function workingDayKey(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function updateTargetHistory(user){
  if(!user) return;
  const s=targetStatus(user.id), key=workingDayKey(new Date());
  if(!targetHistory[user.id]) targetHistory[user.id]={};
  const was=targetHistory[user.id][key]?.complete;
  targetHistory[user.id][key]={date:key,targets:{...s.targets},actual:{...s.actual},achieved:[...s.achieved],complete:s.complete};
  storage.set('bdm_target_history',targetHistory);
  if(s.complete && !was) setTimeout(()=>alert(`Target day complete for ${user.name}. ${[0,6].includes(new Date().getDay())?'Targets achieved.':'Streak day recorded.'}`),50);
}
function userStreak(userId){
  const hist=targetHistory[userId]||{},today=isoToday();
  let current=0,best=0,run=0,previous=null;
  const dates=Object.keys(hist).filter(k=>k<=today).sort();
  dates.forEach(k=>{
    const date=localDateOnly(k);if(!date||[0,6].includes(date.getDay()))return;
    if(hist[k].complete){
      if(previous){const expected=new Date(previous);do{expected.setDate(expected.getDate()+1);}while([0,6].includes(expected.getDay()));if(workingDayKey(expected)!==k)run=0;}
      run++;best=Math.max(best,run);previous=date;
    }else{run=0;previous=null;}
  });
  const d=localDateOnly(new Date());
  while([0,6].includes(d.getDay()))d.setDate(d.getDate()-1);
  if(workingDayKey(d)===today&&!hist[today]?.complete){d.setDate(d.getDate()-1);while([0,6].includes(d.getDay()))d.setDate(d.getDate()-1);}
  while(hist[workingDayKey(d)]?.complete){current++;d.setDate(d.getDate()-1);while([0,6].includes(d.getDay()))d.setDate(d.getDate()-1);}
  return {current,best};
}

function pct(actual,target){ return target>0 ? Math.min(100,actual/target*100) : 0; }
function leadAgeDays(l){
  if(!l.createdAt) return 0;
  return Math.max(0,Math.floor((Date.now()-new Date(l.createdAt).getTime())/86400000));
}
function leadAgeBucket(l){
  const d=leadAgeDays(l);
  if(d<=7) return '0–7 days';
  if(d<=14) return '8–14 days';
  if(d<=28) return '15–28 days';
  return '29+ days';
}
function normalizeStage(l){
  if(l.stage) return l.stage==='Open'?'Opportunity':l.stage;
  if(l.status==='won') return 'Won';
  if(l.status==='lost') return 'Lost';
  return 'Opportunity';
}
function leadIsClosed(l){ const s=normalizeStage(l); return s==='Won'||s==='Lost'; }
function leadOpportunityScore(l){
  let score=0;
  score += Math.min(35, n(l.value)/1000);
  score += Math.min(20, n(l.margin)/500);
  const days=leadAgeDays(l);
  if(days<=7) score+=15; else if(days<=14) score+=10; else if(days<=28) score+=5;
  if(l.requiredByDate){
    const rp=periodInfo(l.requiredByDate).period;
    const cp=currentSalesPeriodNumber();
    if(rp===cp) score+=15; else if(rp===cp+1) score+=10;
  }
  if(normalizeStage(l)==='Quoted') score+=10;
  if(normalizeStage(l)==='Awaiting decision') score+=12;
  return Math.max(0,Math.min(100,Math.round(score)));
}
function customerOpportunityScore(c, prev){
  let score=0;
  const sales=n(c.salesMAT), rec=n(c.recency), loyalty=n(c.loyalty), tx=n(c.transactionsMAT);
  score += Math.min(30,sales/2000);
  if(rec>=3 && rec<=6) score+=20;
  if(rec>=7 && rec<=11) score+=15;
  if(rec>=12 && rec<=14) score+=10;
  if(loyalty>0 && loyalty<40) score+=10;
  if(loyalty>=70) score+=5;
  if(tx>=10) score+=10;
  if(prev && n(prev.salesMAT)>sales) score+=15;
  return Math.max(0,Math.min(100,Math.round(score)));
}
function bestTimeForCustomer(customerId){
  const acts=activity.filter(a=>a.customerId===customerId && a.iso);
  const byHour={};
  acts.forEach(a=>{
    const hr=new Date(a.iso).getHours();
    if(!byHour[hr]) byHour[hr]={calls:0,success:0};
    byHour[hr].calls++;
    if(a.type==='Spoke to customer'||a.type==='Quote given') byHour[hr].success++;
  });
  const entries=Object.entries(byHour).filter(([,v])=>v.calls>0);
  if(!entries.length) return null;
  entries.sort((a,b)=>{
    const ar=a[1].success/a[1].calls, br=b[1].success/b[1].calls;
    if(br!==ar) return br-ar;
    return b[1].calls-a[1].calls;
  });
  return `${String(entries[0][0]).padStart(2,'0')}:00–${String(Number(entries[0][0])+1).padStart(2,'0')}:00`;
}

function escapeHtml(v){return String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));}

function latestSnapshot(){ return snapshots.length ? snapshots[snapshots.length-1] : null; }

function classifyCustomer(c, prevMap){
  const id = String(c.customer ?? '').trim();
  const prev = prevMap ? prevMap[id] : null;
  const rec = n(c.recency);
  const sales = n(c.salesMAT);
  const tx = n(c.transactionsMAT);

  let lifecycle = 'active';
  if (!prev && snapshots.length > 1) lifecycle = 'new';
  if (sales === 0 && tx === 0) lifecycle = 'never';
  if (rec >= 12 && rec <= 14) lifecycle = 'critical';
  else if (rec >= 3 && rec < 12) lifecycle = 'atrisk';

  let movement = {};
  if (prev){
    movement.sales = sales - n(prev.salesMAT);
    movement.transactions = tx - n(prev.transactionsMAT);
  }
  const regularGoneQuiet = !!prev && n(prev.transactionsMAT) >= 10 && rec >= 3 && movement.transactions <= 0;
  return {...c, lifecycle, movement, regularGoneQuiet};
}

function currentCustomerModel(){
  const cur = latestSnapshot();
  if(!cur || !cur.customers.length) return null;

  const prev = snapshots.length > 1 ? snapshots[snapshots.length-2] : null;
  const prevMap = {};
  (prev?.customers || []).forEach(c => prevMap[String(c.customer ?? '').trim()] = c);

  const currentIds = new Set(cur.customers.map(c=>String(c.customer ?? '').trim()));
  const dead = (prev?.customers || []).filter(c => !currentIds.has(String(c.customer ?? '').trim()));

  const enriched = cur.customers.map(c=>classifyCustomer(c, prevMap));
  return {cur, prev, dead, enriched};
}


function customerPriorityTags(c, prev){
  const tags=[];
  const sales=n(c.salesMAT), tx=n(c.transactionsMAT), rec=n(c.recency), loyalty=n(c.loyalty);
  const prevSales=prev ? n(prev.salesMAT) : 0;
  const delta=prev ? sales-prevSales : 0;
  if(rec>=12 && rec<=14) tags.push('critical');
  if(sales===0 && tx===0) tags.push('never');
  if(rec>=12 && sales>0) tags.push('lapsed12');
  if(prev && prevSales>0 && delta<=-(Math.max(1000,prevSales*0.25))) tags.push('spenddrop');
  if(loyalty>0 && loyalty<35) tags.push('lowloyalty');
  if(loyalty>=75) tags.push('highloyalty');
  if(tx===1 && rec>=1) tags.push('oneoff');
  const kitchen=n(c.kitchenNumberMAT), floor=n(c.flooringMAT), joinery=n(c.joineryMAT);
  const productTotal=kitchen+floor+joinery;
  if(productTotal>0){
    if(kitchen/productTotal>=0.6) tags.push('kitchenheavy');
    if(floor/productTotal>=0.6) tags.push('flooringheavy');
    if(joinery/productTotal>=0.6) tags.push('joineryheavy');
  }
  if(!prev && sales===0 && tx===0) tags.push('newnostart');
  if(sales>=20000 && rec>=3) tags.push('highvalueatrisk');
  if(sales>0 && (n(c.appliancesMAT)===0 || n(c.worktopsMAT)===0 || joinery===0)) tags.push('productgap');
  return tags;
}
function priorityRankForCustomer(c, prev){
  const tags=customerPriorityTags(c,prev);
  for(let i=0;i<callPriorityConfig.length;i++){
    if(tags.includes(callPriorityConfig[i].key)) return i;
  }
  return callPriorityConfig.length+1;
}

function liveGroups(){
  const model = currentCustomerModel();
  if(!model){
    const demo={...demoCustomers};
    const top=top20Customers(), allDemo=Object.values(demoCustomers).flat();

    demo.newNurture=demo.new.map(c=>({...c,workflow:'newNurture',workflowLabel:'NEW ACCOUNT · CONTACT 1 OF 4',offer:nurtureSettings.newOffers[0]}));
    demo.oldNurture=demo.critical.map(c=>({...c,workflow:'oldNurture',workflowLabel:`OLD ACCOUNT NURTURE · P${c.months}`,offer:nurtureSettings.oldOffers[0]}));
    demo.thanks=[];
    demo.normal=[...demo.atrisk,...demo.growth];
    return demo;
  }
  const prevMapForPriority={};
  (model.prev?.customers||[]).forEach(pc=>prevMapForPriority[String(pc.customer||'').trim()]=pc);

  const make = c => {
    const wf=workflowForCustomer(c);
    const id=String(c.customer||'').trim();
    return {
      id,name:c.name||'Unnamed customer',phone:String(c.phone||c.telephone||'').trim(),months:n(c.recency),
      last:c.recency===0?'Current period':`${n(c.recency)} periods ago`,
      sales:n(c.salesMAT),tx:n(c.transactionsMAT),
      pattern:c.regularGoneQuiet?'Previously regular trader now quiet':'Imported customer',
      offer:wf?.reason || (c.lifecycle==='critical'?'Urgent reactivation offer':c.lifecycle==='atrisk'?'Re-engagement call / offer':c.lifecycle==='never'?'Secure first trade':'Review growth opportunity'),
      lastnote:activity.find(a=>String(a.customerId)===id)?.detail||'No BD note recorded',
      opportunityScore:customerOpportunityScore(c,prevMapForPriority[id]),
      workflow:wf?.key||null, workflowLabel:wf?.label||null,
      daysOpen:daysOpenForCustomer(c), recentSpend:recentSpend30(id), recentTransactions:recentTxFor(id)
    };
  };
  const ytdTop=top20Customers(), ytdIds=new Set(ytdTop.map(c=>c.customer));
  const mapped=model.enriched.map(c=>{const m=make(c);if(ytdIds.has(m.id)){m.salesYTD=ytdTop.find(t=>t.customer===m.id).salesYTD;}return m;});
  const importedIds=new Set(mapped.map(c=>c.id));
  ytdTop.filter(c=>!importedIds.has(c.customer) && normalContactDue(c.customer)).forEach(c=>mapped.push({id:c.customer,name:c.name||c.customer,phone:'',sales:c.salesYTD,salesLabel:'YTD sales',tx:0,workflow:'top20',workflowLabel:'TOP 20 CUSTOMER · YTD',offer:nurtureSettings.top20Message,lastnote:'From YTD report'}));
  const buckets={top20:[],newNurture:[],oldNurture:[],thanks:[],critical:[],atrisk:[],growth:[],new:[],normal:[]};
  mapped.forEach(m=>{
    if(m.workflow){ buckets[m.workflow].push(m); return; } // suppression: one best action only
    const raw=model.enriched.find(c=>String(c.customer||'').trim()===m.id);
    if(raw?.lifecycle==='critical') buckets.critical.push(m);
    else if(raw?.lifecycle==='atrisk'||raw?.regularGoneQuiet) buckets.atrisk.push(m);
    else if(raw?.lifecycle==='new'||raw?.lifecycle==='never') buckets.new.push(m);
    else if(raw?.lifecycle==='active'&&n(raw.salesMAT)>0) buckets.growth.push(m);
    if(normalContactDue(m.id)) buckets.normal.push(m);
  });
  buckets.top20.sort((a,b)=>ytdTop.findIndex(c=>c.customer===a.id)-ytdTop.findIndex(c=>c.customer===b.id));
  return buckets;
}

function reportCounts(){
  const model=currentCustomerModel();
  if(!model) return {never:7,quiet:11,drop:9,high:4,one:13,gaps:18,react:7,dead:5};
  const e=model.enriched;
  return {
    never:e.filter(c=>n(c.salesMAT)===0 && n(c.transactionsMAT)===0).length,
    quiet:e.filter(c=>c.regularGoneQuiet).length,
    drop:e.filter(c=>c.movement && c.movement.sales<0).length,
    high:e.filter(c=>n(c.salesMAT)>=20000 && n(c.recency)>=3).length,
    one:e.filter(c=>n(c.transactionsMAT)===1 && n(c.recency)>=1).length,
    gaps:e.filter(c=>n(c.salesMAT)>0 && (n(c.appliancesMAT)===0 || n(c.worktopsMAT)===0)).length,
    react:e.filter(c=>c.movement && c.movement.sales>0 && n(c.recency)<=1).length,
    dead:model.dead.length
  };
}

async function handleImport(ev){
  const file=ev.target.files[0];
  if(!file) return;
  const status=document.getElementById('importStatus');
  if(typeof XLSX==='undefined'){
    status.innerHTML='<div class="import-status error">Spreadsheet reader did not load. Check your internet connection and try again.</div>';
    return;
  }
  status.innerHTML='<div class="import-status">Reading file…</div>';
  try{
    const buf=await file.arrayBuffer();
    const wb=XLSX.read(buf,{type:'array'});
    const ws=wb.Sheets[wb.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:null,raw:true});
    const customers=[];
    const ytdHeader=rows.slice(0,4).map(row=>(row||[]).findIndex(v=>/ytd|year\s*to\s*date/i.test(String(v||'')) && /sales|spend/i.test(String(v||'')))).find(i=>i>=0);
    for(let i=4;i<rows.length;i++){
      const row=rows[i] || [];
      const id=row[0];
      const name=row[1];
      if((id===null || id==='') && (name===null || name==='')) continue;
      const obj={};
      for(let c=0;c<38;c++) obj[FIELD_NAMES[c]]=row[c] ?? null;
      if(ytdHeader!=null) obj.salesYTD=reportNumber(row[ytdHeader]);
      customers.push(obj);
    }
    const date=document.getElementById('snapshotDate').value || new Date().toISOString().slice(0,10);
    snapshots.push({
      id:Date.now(),
      date,
      filename:file.name,
      sheet:wb.SheetNames[0],
      customers
    });
    storage.set('bdm_snapshots', snapshots);
    status.innerHTML=`<div class="import-status"><b>Imported successfully</b><br>${customers.length} customer rows from "${wb.SheetNames[0]}".</div>`;
    setTimeout(renderImport,700);
  }catch(err){
    status.innerHTML=`<div class="import-status error"><b>Import failed</b><br>${String(err.message || err)}</div>`;
  }
}

function leadStageSummary(list){
  const out={};
  LEAD_STAGES.forEach(s=>out[s]={count:0,value:0,margin:0});
  list.forEach(l=>{
    const s=normalizeStage(l);
    if(!out[s]) out[s]={count:0,value:0,margin:0};
    out[s].count++; out[s].value+=n(l.value); out[s].margin+=n(l.margin);
  });
  return out;
}
function categoryPerformance(category){
  const list=leads.filter(l=>l.category===category);
  const won=list.filter(l=>normalizeStage(l)==='Won');
  const lost=list.filter(l=>normalizeStage(l)==='Lost');
  const decided=won.length+lost.length;
  const avgDaysWon=won.length ? won.reduce((s,l)=>s+leadAgeDays(l),0)/won.length : 0;
  return {
    count:list.length,
    value:list.reduce((s,l)=>s+n(l.value),0),
    margin:list.reduce((s,l)=>s+n(l.margin),0),
    winRate:decided?won.length/decided*100:0,
    avgValue:list.length?list.reduce((s,l)=>s+n(l.value),0)/list.length:0,
    avgDaysWon
  };
}

function callAnalytics(){
  const callActs=activity.filter(a=>['Spoke to customer','Voicemail left','No answer','Quote given'].includes(a.type) && a.iso);
  const byDay={}, byHour={}, successByHour={};
  let durationTotal=0,durationCount=0;
  callActs.forEach(a=>{
    const d=new Date(a.iso);
    const day=d.toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'2-digit'});
    const hour=d.getHours();
    byDay[day]=(byDay[day]||0)+1;
    byHour[hour]=(byHour[hour]||0)+1;
    if(a.type==='Spoke to customer'||a.type==='Quote given') successByHour[hour]=(successByHour[hour]||0)+1;
    if(n(a.durationMinutes)>0){durationTotal+=n(a.durationMinutes);durationCount++;}
  });
  return {byDay,byHour,successByHour,avgDuration:durationCount?durationTotal/durationCount:0};
}


function managerInterventions(){
  const today=isoToday(), out=[];
  leads.forEach(l=>{
    if(leadIsClosed(l)) return;
    const age=leadAgeDays(l);
    if(l.followUpDate && l.followUpDate<today) out.push({type:'Overdue lead',text:`${l.customer} · ${l.ownerName||'Unassigned'} · ${money(l.value)}`});
    if(age>28) out.push({type:'Lead 29+ days old',text:`${l.customer} · ${l.ownerName||'Unassigned'} · ${normalizeStage(l)}`});
    if(n(l.value)>=10000 && !l.followUpDate) out.push({type:'High-value lead with no follow-up',text:`${l.customer} · ${money(l.value)} · ${l.ownerName||'Unassigned'}`});
  });
  const m=dashboardMetrics();
  users.filter(u=>u.active!==false).forEach(u=>{
    const overdue=leads.filter(l=>l.ownerId===u.id && !leadIsClosed(l) && l.followUpDate && l.followUpDate<today).length;
    if(overdue>=3) out.push({type:'Staff overdue workload',text:`${u.name} has ${overdue} overdue leads`});
  });
  return out.slice(0,50);
}

    <section class="dashboard-block">
      <div class="dashboard-title">Call analytics</div>

        const a=callAnalytics();

        const maxSuccess=Math.max(1,...Object.values(a.successByHour));
        return `
          <div class="kpi-grid" style="margin-bottom:12px">

              ${Object.entries(a.byDay).slice(-14).map(([label,count])=>`

            </div>

          <div class="settings-card">
            <b>Time of day of calls</b>
            <div class="analytics-bars" style="margin-top:10px">
              ${Array.from({length:12},(_,i)=>i+8).map(hour=>{
                const count=a.byHour[hour]||0;
                return `<div class="analytics-row"><span class="small-note">${String(hour).padStart(2,'0')}:00</span><div class="bar-track"><div class="bar-fill" style="width:${count/maxHour*100}%"></div></div><b>${count}</b></div>`;
              }).join('')}
            </div>
          </div>
          <div class="settings-card">
            <b>Time of day of successful calls</b>
            <div class="analytics-bars" style="margin-top:10px">
              ${Array.from({length:12},(_,i)=>i+8).map(hour=>{
                const count=a.successByHour[hour]||0;
                return `<div class="analytics-row"><span class="small-note">${String(hour).padStart(2,'0')}:00</span><div class="bar-track"><div class="bar-fill success" style="width:${count/maxSuccess*100}%"></div></div><b>${count}</b></div>`;
              }).join('')}
            </div>
          </div>`;
      })()}
    </section>

    <section class="dashboard-block">
      <div class="dashboard-title">Calls needed today</div>
      <div class="list">
        ${leads.filter(l=>l.status!=='won'&&l.status!=='lost'&&l.followUpDate===today).map(l=>`
          <div class="history-card">
            <div class="row"><div><b>${l.customer}</b><div class="sub">${l.ownerName||'Unassigned'}</div></div><span class="badge today">Today</span></div>
            <div class="sub">${l.category||'Other'} · ${money(l.value)}</div>
          </div>`).join('') || '<div class="history-card"><span class="muted">No lead follow-up calls due today.</span></div>'}
      </div>
    </section>`;
}

              <div class="sub">Daily activity targets are set in Daily targets & streaks above.</div>

        <div class="setting-row"><label>Voicemail buttons</label><textarea id="vmMessages" rows="7">${contactMessages('voicemail').join('\n')}</textarea><div class="small-note">One message per line.</div></div>
        <button class="wide-btn" id="saveStandardMessages">Save standard messages</button>
      </section>

      <section class="settings-card">
        <div class="row"><div><h2>Users</h2><div class="sub">Each user has a 4 digit PIN. Manager users get the Manager tab.</div></div><span class="badge">${users.filter(u=>u.active!==false).length} active</span></div>

        <div class="user-form-grid">
          <div class="setting-row"><label>Name</label><input id="newUserName" placeholder="e.g. Paul"></div>
          <div class="setting-row"><label>4 digit PIN</label><input id="newUserPin" inputmode="numeric" maxlength="4" placeholder="••••"></div>

        <div class="user-list">
          ${users.map(u=>`<div class="user-card">
            <div class="row"><div><b>${u.name}</b><div class="role">${u.manager?'Manager':'User'} · ${u.active===false?'Inactive':'Active'}</div></div>

  document.getElementById('saveSettings').onclick=()=>{
    const values={
      critical:document.getElementById('msgCritical').value,
      atrisk:document.getElementById('msgAtRisk').value,
      new:document.getElementById('msgNew').value,
      growth:document.getElementById('msgGrowth').value
    };
    requestPin({
      title:'Save period settings',
      subtitle:`Confirm changes for P${p}`,
      onSuccess:(user)=>{
        savePeriodSettings(p,{...values,_audit:auditStamp(user,'Period settings updated')});
        renderCalls();
      }
    });
  };

  document.querySelectorAll('[data-priority-up]').forEach(btn=>{
    btn.onclick=()=>{
      const i=Number(btn.dataset.priorityUp);
      if(i>0){[callPriorityConfig[i-1],callPriorityConfig[i]]=[callPriorityConfig[i],callPriorityConfig[i-1]];renderSettings();}
    };
  });
  document.querySelectorAll('[data-priority-down]').forEach(btn=>{
    btn.onclick=()=>{
      const i=Number(btn.dataset.priorityDown);
      if(i<callPriorityConfig.length-1){[callPriorityConfig[i+1],callPriorityConfig[i]]=[callPriorityConfig[i],callPriorityConfig[i+1]];renderSettings();}
    };
  });
  document.getElementById('savePriorityOrder').onclick=()=>{
    requestPin({
      title:'Save call priorities',
      subtitle:'Manager PIN required',
      managerOnly:true,
      onSuccess:()=>{
        storage.set('bdm_call_priorities',callPriorityConfig);
        renderCalls();
      }
    });
  };

  document.getElementById('saveStandardMessages').onclick=()=>{
    const spoke=document.getElementById('spokeMessages').value.split('\n').map(x=>x.trim()).filter(Boolean);
    const voicemail=document.getElementById('vmMessages').value.split('\n').map(x=>x.trim()).filter(Boolean);
    requestPin({title:'Save standard call notes',subtitle:'Manager PIN required',managerOnly:true,onSuccess:()=>{
      standardContactMessages={spoke,voicemail};
      storage.set('bdm_standard_contact_messages',standardContactMessages);
      renderSettings();
    }});
  };


  document.getElementById('ytdFileInput').onchange=ev=>{
    const file=ev.target.files[0];if(!file) return;
    requestPin({title:'Upload YTD report',subtitle:'Manager PIN required',managerOnly:true,onSuccess:()=>{renderImport();validatedReport('ytd',file);}});
  };
  document.getElementById('saveNurtureSettings').onclick=()=>{
    requestPin({title:'Save nurture settings',subtitle:'Manager PIN required',managerOnly:true,onSuccess:()=>{
      nurtureSettings.newOffers=document.getElementById('newNurtureOffers').value.split('\n').map(x=>x.trim()).filter(Boolean).slice(0,4);
      nurtureSettings.oldOffers=document.getElementById('oldNurtureOffers').value.split('\n').map(x=>x.trim()).filter(Boolean);
      nurtureSettings.oldSpacingDays=+document.getElementById('oldSpacingDays').value||18;
      nurtureSettings.thanksThreshold=+document.getElementById('thanksThreshold').value||0;
      nurtureSettings.top20Message=document.getElementById('top20Message').value.trim();
      storage.set('bdm_nurture_settings',nurtureSettings);
      renderSettings();
    }});
  };
  document.getElementById('saveDailyTargets').onclick=()=>{
    requestPin({title:'Save daily targets',subtitle:'Manager PIN required',managerOnly:true,onSuccess:()=>{
      const next={...dailyUserTargets};
      users.forEach(u=>{const config=dailyTargetFor(u.id);next[u.id]={targets:{...config.targets},enabled:{...config.enabled}};});
      document.querySelectorAll('[data-target-value]').forEach(i=>next[i.dataset.targetUser].targets[i.dataset.targetValue]=Math.max(0,Math.floor(+i.value||0)));
      document.querySelectorAll('[data-target-enabled]').forEach(i=>next[i.dataset.targetUser].enabled[i.dataset.targetEnabled]=i.checked);
      dailyUserTargets=next;
      storage.set('bdm_daily_user_targets',dailyUserTargets);
      renderSettings();
    }});
  };

  document.getElementById('saveTargets').onclick=()=>{
    requestPin({
      title:'Save targets',
      subtitle:'Manager PIN required',
      managerOnly:true,
      onSuccess:(manager)=>{
        periodTargets[p]={
          sales:+document.getElementById('targetSales').value||0,
          margin:+document.getElementById('targetMargin').value||0,
          leads:+document.getElementById('targetLeads').value||0,
          contactPct:+document.getElementById('targetContact').value||0,
          audit:auditStamp(manager,'Period targets updated')
        };
        if(!userTargets[p]) userTargets[p]={};
        document.querySelectorAll('[data-ut]').forEach(inp=>{
          const uid=inp.dataset.ut, key=inp.dataset.k;
          if(!userTargets[p][uid]) userTargets[p][uid]={calls:0,conversations:0,leads:0,pipeline:0,margin:0};
          userTargets[p][uid][key]=+inp.value||0;
        });
        storage.set('bdm_period_targets',periodTargets);
        storage.set('bdm_user_targets',userTargets);
        renderSettings();
      }
    });
  };
  document.getElementById('addUserBtn').onclick=()=>{
    const name=document.getElementById('newUserName').value.trim();
    const pin=document.getElementById('newUserPin').value.trim();
    const manager=document.getElementById('newUserManager').checked;
    if(!name){alert('Enter a user name.');return;}
    if(!/^\d{4}$/.test(pin)){alert('PIN must be exactly 4 digits.');return;}
    requestPin({
      title:'Add user',
      subtitle:'A manager PIN is required to add users.',
      managerOnly:true,
      onSuccess:async(admin)=>{
        const pinHash=await sha256(pin);
        users.push({id:'U'+Date.now(),name,pinHash,manager,active:true,createdAudit:auditStamp(admin,'User created')});
        storage.set('bdm_users',users);
        renderSettings();
      }
    });
  };
  document.querySelectorAll('[data-toggle-user]').forEach(btn=>{
    btn.onclick=()=>{
      const target=users.find(u=>u.id===btn.dataset.toggleUser);
      if(!target) return;
      requestPin({
        title:target.active===false?'Activate user':'Deactivate user',
        subtitle:'A manager PIN is required.',
        managerOnly:true,
        onSuccess:(admin)=>{
          target.active=target.active===false?true:false;
          target.updatedAudit=auditStamp(admin,target.active?'User activated':'User deactivated');
          storage.set('bdm_users',users);
          if(target.id===activeUserId && !target.active){activeUserId=null;storage.set('bdm_active_user',null);}
          syncManagerSession();
          renderSettings();
        }
      });
    };
  });
  document.getElementById('closeSettings').onclick=renderHome;
}

function allCallReasons(c){
  const raw=currentCustomerModel()?.enriched.find(x=>String(x.customer)===String(c.id));
  const reasons=[];
  if(top20Set().has(String(c.id))&&normalContactDue(c.id)) reasons.push({key:'top20',label:'Top 20 customer',reason:nurtureSettings.top20Message});
  const p=nurtureRecord(c.id);
  if(raw){
    if(daysOpenForCustomer(raw)<60&&n(raw.transactionsMAT)<3&&p.newContacts<4) reasons.push({key:'newNurture',label:'New account nurture',reason:nurtureSettings.newOffers[p.newContacts]||'Check current and upcoming work'});
    if(n(raw.recency)>=12&&n(raw.recency)<15&&(!p.lastOldContact||daysBetween(localDateOnly(p.lastOldContact),localDateOnly(new Date()))>=n(nurtureSettings.oldSpacingDays||18))) reasons.push({key:'oldNurture',label:'Old account nurture',reason:nurtureSettings.oldOffers[Math.min(p.oldContacts,nurtureSettings.oldOffers.length-1)]});
  }
  const latest=recentTxFor(c.id)[0]?.date;
  if(recentSpend30(c.id)>=n(nurtureSettings.thanksThreshold)&&latest&&(!p.thanksHandledThrough||latest>p.thanksHandledThrough)) reasons.push({key:'thanks',label:'Given Thanks',reason:money(recentSpend30(c.id))+' spent in the last 30 days'});
  if(c.workflow&&!reasons.some(r=>r.key===c.workflow)) reasons.push({key:c.workflow,label:c.workflowLabel||c.workflow,reason:c.offer});
  ownDue(queueOwnerId||activeUserId).filter(f=>String(f.customerId)===String(c.id)).forEach(f=>reasons.push({key:f.kind+':'+f.id,label:f.date<isoToday()?'Overdue follow-up':'Due today',reason:f.date+' · '+f.reason}));

function dailyQueue(){
  const groups=liveGroups(),seen=new Set(),out=[];
  const model=currentCustomerModel(),raw=new Map((model?.enriched||[]).map(c=>[String(c.customer),c])),previous=new Map((model?.prev?.customers||[]).map(c=>[String(c.customer),c]));
  const add=c=>{if(c&&!seen.has(String(c.id))){seen.add(String(c.id));out.push(c);}};
  const candidates=Object.values(groups).flat();
  ownDue().forEach(f=>add(customerForFollowup(f,candidates)));
  const notSpokenToday=c=>!activity.some(a=>String(a.customerId)===String(c.id)&&recordDateKey(a.iso)===isoToday()&&['Spoke to customer','Quote given'].includes(a.type));
  ['top20','oldNurture','newNurture','thanks'].forEach(k=>(groups[k]||[]).filter(notSpokenToday).forEach(add));
  const rank=c=>raw.has(String(c.id))?priorityRankForCustomer(raw.get(String(c.id)),previous.get(String(c.id))):callPriorityConfig.length+1;
  ['critical','atrisk','new','growth','normal'].flatMap(k=>groups[k]||[]).filter(notSpokenToday)
    .sort((a,b)=>rank(a)-rank(b)||n(b.opportunityScore)-n(a.opportunityScore)).forEach(add);
  return out;
}
function customerForFollowup(f,candidates=Object.values(liveGroups()).flat()){
  const current=candidates.find(c=>String(c.id)===String(f.customerId));if(current)return current;
  const historical=[...snapshots].reverse().flatMap(s=>s.customers||[]).find(c=>String(c.customer)===String(f.customerId));
  return {id:f.customerId,name:f.customer||historical?.name,phone:String(historical?.phone||historical?.telephone||''),
    offer:f.reason,pattern:'Follow-up',lastnote:activity.find(a=>String(a.customerId)===String(f.customerId))?.detail||'',
    months:n(historical?.recency),sales:n(historical?.salesMAT),tx:n(historical?.transactionsMAT)};
}

const originalPin=requestPin;

      action.covered.filter(k=>k.startsWith('task:')).forEach(k=>{const f=followups.find(f=>f.id===k.slice(5));if(f){f.completedAt=completedAt;f.completedBy=user.id;}});

    // The existing save creates the call and quote, then advances the frozen queue.
    const renderAfter=renderCustomer;renderCustomer=()=>{};
    try{options.onSuccess(user);}finally{renderCustomer=renderAfter;}
    const latest=activity[0];if(latest&&String(latest.customerId)===String(action.customerId)){latest.deal=action.deal;latest.follow=action.date;latest.covered=action.covered;latest.nextActionReason=action.reason;storage.set('bdm_activity',activity);}
    if(action.type==='quote'&&leads[0]){leads[0].nextActionReason=action.reason;storage.set('bdm_leads',leads);}
    if(action.type==='contact'||action.type==='quote'){
      const p=nurtureRecord(action.customerId);Object.assign(p,before);
      if(action.covered.includes('newNurture'))p.newContacts=Math.min(4,n(before.newContacts)+1);
      if(action.covered.includes('oldNurture')){p.oldContacts=n(before.oldContacts)+1;p.lastOldContact=isoToday();}

};

  document.getElementById('salesValue').oninput=updateMargin;document.getElementById('salesMargin').oninput=updateMargin;updateMargin();
  const refresh=()=>{document.getElementById('salesKitchen').hidden=document.getElementById('salesCategory').value!=='Kitchen';document.getElementById('salesLossWrap').hidden=document.getElementById('salesStage').value!=='Lost';};
  document.getElementById('salesCategory').onchange=refresh;document.getElementById('salesStage').onchange=refresh;refresh();
  document.querySelectorAll('[data-sales-days]').forEach(b=>b.onclick=()=>{const d=new Date();d.setDate(d.getDate()+Number(b.dataset.salesDays));document.getElementById('salesFollow').value=workingDayKey(d);});
  document.getElementById('cancelSalesLead').onclick=()=>returnTo?returnTo():renderLeads();
  document.getElementById('saveSalesLead').onclick=()=>{

    const error=validateSalesLead(data,existing);

    requestPin({title:editing?'Save lead update':'Save lead',subtitle:'Confirm sales update for '+data.customer,onSuccess:user=>{
      const now=new Date().toISOString(),closed=['Won','Lost'].includes(data.stage),status=data.stage==='Won'?'won':data.stage==='Lost'?'lost':'open';
      const event={date:now,label:editing?'Lead updated · '+data.stage:'Lead created · '+data.stage,text:[data.details,'Next action: '+(closed?'Closed':data.followUpDate+' · '+data.nextActionReason),'Responsible: '+users.find(u=>u.id===data.ownerId)?.name,data.category==='Kitchen'?'Designer: '+(data.designerName||'Not assigned')+' · '+data.handoverStatus:'',data.handoverNotes,data.lossReason&&data.stage==='Lost'?'Lost: '+data.lossReason:''].filter(Boolean).join(' · '),by:user.name};
      const changed={...data,ownerName:users.find(u=>u.id===data.ownerId).name,status,followUpDate:closed?'':data.followUpDate,lossReason:data.stage==='Lost'?data.lossReason:'',updatedAudit:auditStamp(user,editing?'Lead updated':'Lead created')};
      if(existing){const previous=normalizeStage(existing);Object.assign(existing,changed);if(closed&&previous!==data.stage)existing.closedAt=now;else if(!closed)existing.closedAt=null;existing.events=[...(existing.events||[]),event];}
      else leads.unshift({...changed,id:'L'+Date.now()+'-'+Math.random().toString(36).slice(2,7),createdAt:now,closedAt:closed?now:null,audit:auditStamp(user,'Lead created'),events:[event]});

    }});
  };
}
function validateSalesLead(data,existing){
  if(!data.customerId||!leadFormCustomers().some(c=>c.id===data.customerId))return 'Choose a customer.';
  if(!data.details)return 'Describe the sales opportunity.';
  if(!users.some(u=>u.id===data.ownerId&&(u.active!==false||u.id===existing?.ownerId)))return 'Choose the staff member responsible for this lead.';
  if(!Number.isFinite(data.value)||data.value<0||!Number.isFinite(data.margin)||data.margin>data.value)return 'Check the estimated value and margin.';
  if(data.quoteNo&&!/^\d{6}$/.test(data.quoteNo))return 'Quotation number must be exactly 6 digits.';
  if(['Quoted','Awaiting decision'].includes(data.stage)&&!data.quoteNo)return 'Add the six-digit quotation number for a quoted lead.';
  const closed=['Won','Lost'].includes(data.stage);
  if(!closed&&(!data.followUpDate||!data.nextActionReason))return 'Set a next action date and describe what needs to happen.';
  if(!closed&&data.followUpDate<isoToday()&&data.followUpDate!==existing?.followUpDate)return 'Choose today or a future next action date.';
  if(data.stage==='Lost'&&!data.lossReason)return 'Choose a lost reason.';
  if(data.stage==='Appointment booked'&&!data.appointmentDate&&data.category==='Kitchen')return 'Set the kitchen appointment date.';
  return validateHandover(data);
}

const originalImport=renderImport;
renderImport=function(){
  originalImport();title.textContent='Reports and backups';
  app.insertAdjacentHTML('beforeend',`<section class="form-card"><h2>YTD sales report</h2><p class="muted">Top 20 customers use YTD sales. Include Customer / Account, Name and YTD Sales columns.</p><input id="centreYtd" type="file" accept=".xlsx,.xls,.xlsm,.csv"><h2>Transactions report</h2><p class="muted">Include Customer / Account, Date and Value / Sales / Amount columns. Reference, Description and Category are optional.</p><input id="centreTransactions" type="file" accept=".xlsx,.xls,.xlsm,.csv"><div id="reportStatus"></div></section><section class="form-card"><h2>Report freshness</h2>${['customers','ytd','transactions'].map(k=>{const m=reportMetadata[k];return `<p><b>${esc(k)}</b> · ${m?esc(m.filename)+' · '+esc(m.uploadedAt.slice(0,10))+' · '+m.rows+' rows'+(m.warnings?.length?'<br>'+m.warnings.map(esc).join('<br>'):''):'No upload recorded'}</p>`;}).join('')}<p class="muted">${cloud.enabled?'Depot data is shared securely. Download a backup for your own records.':'Data and PIN access currently stay in this browser. Export backups before changing device or clearing browser storage.'}</p><button class="wide-btn" id="exportBackup">Download backup</button><label>Restore backup<input id="restoreBackup" type="file" accept=".json"></label><div id="backupStatus"></div></section>`);
  document.getElementById('fileInput').onchange=ev=>requestPin({title:'Upload customer report',managerOnly:true,onSuccess:()=>validatedReport('customers',ev.target.files[0])});
  document.getElementById('centreYtd').onchange=ev=>requestPin({title:'Upload YTD report',managerOnly:true,onSuccess:()=>validatedReport('ytd',ev.target.files[0])});
