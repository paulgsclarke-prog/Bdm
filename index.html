  document.getElementById('restoreBackup').onchange=ev=>{const file=ev.target.files[0];if(file)requestPin({title:'Restore backup',managerOnly:true,onSuccess:()=>restoreBackup(file)});};
};
function reportDate(value){
  if(typeof value==='number'){const d=XLSX.SSF.parse_date_code(value);return d?`${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`:'';}
  const str=String(value??'').trim();let match=str.match(/^(\d{4})-(\d{2})-(\d{2})/);if(!match){const uk=str.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/);if(uk)match=[null,uk[3],uk[2].padStart(2,'0'),uk[1].padStart(2,'0')];}
  if(!match)return '';const date=`${match[1]}-${match[2]}-${match[3]}`;const d=new Date(date+'T12:00:00Z');return !isNaN(d)&&d.toISOString().slice(0,10)===date?date:'';
}
function validatedCustomerRows(rows){
  const customers=[],seen=new Set();
  const phoneColumn=rows.slice(0,4).flatMap(row=>(row||[]).map((v,i)=>/^(?:(?:contact|customer|primary|main)\s+)?(?:telephone|phone|mobile|tel)(?:\s+(?:number|no\.?))?$/i.test(String(v||'').trim())?i:-1)).find(i=>i>=0);
  const ytd=rows.slice(0,4).map(row=>(row||[]).findIndex(v=>/ytd|year\s*to\s*date/i.test(String(v||''))&&/sales|spend/i.test(String(v||'')))).find(i=>i>=0);
  rows.slice(4).forEach((row,i)=>{if(!(row||[]).some(v=>v!=null&&String(v).trim()))return;const id=String(row[0]??'').trim();if(/^(total|grand total)$/i.test(id))return;if(!id||!String(row[1]??'').trim())throw new Error('Missing account or name on row '+(i+5));if(seen.has(id))throw new Error('Duplicate customer account '+id);seen.add(id);const obj={};FIELD_NAMES.forEach((k,c)=>obj[k]=row[c]??null);obj.customer=id;if(phoneColumn!=null)obj.phone=String(row[phoneColumn]??'').trim();if(ytd!=null)obj.salesYTD=reportNumber(row[ytd]);customers.push(obj);});
  if(!customers.length)throw new Error('No customer rows found after the four report header rows.');return customers;
}
function transactionRows(rows){
  const norm=v=>String(v??'').toLowerCase().replace(/[^a-z0-9]/g,'');
  let header=-1,cols;
  for(let i=0;i<Math.min(30,rows.length);i++){const h=rows[i].map(norm);const find=aliases=>h.findIndex(v=>aliases.includes(v));const c={id:find(['customer','customerid','customernumber','account','accountnumber','accountno']),date:find(['date','transactiondate','invoicedate']),value:find(['value','amount','sales','netsales','transactionvalue']),reference:find(['reference','invoicenumber','invoiceno','transactionid']),detail:find(['description','details','detail']),category:find(['category','productcategory'])};if(c.id>=0&&c.date>=0&&c.value>=0){header=i;cols=c;break;}}
  if(header<0)throw new Error('Could not find Account, Date and Value columns.');
  const out=[];rows.slice(header+1).forEach((row,i)=>{if(!row.some(v=>v!=null&&String(v).trim()))return;const id=String(row[cols.id]??'').trim();if(/total/i.test(id))return;const date=reportDate(row[cols.date]);const numeric=String(row[cols.value]??'').replace(/[£$,\s()]/g,'');if(!id||!date||!numeric||!Number.isFinite(Number(numeric)))throw new Error('Invalid account, date or amount on row '+(header+i+2));if(date>isoToday())throw new Error('Future transaction date on row '+(header+i+2));out.push({customerId:id,date,value:reportNumber(row[cols.value]),reference:String(row[cols.reference]??'').trim(),detail:String(row[cols.detail]??''),category:String(row[cols.category]??'')});});if(!out.length)throw new Error('No transactions found.');return out;
}
function txKey(t){return t.reference?'ref:'+t.customerId+':'+t.reference:[t.customerId,t.date,t.value,t.detail||'',t.category||''].join('|');}
async function validatedReport(kind,file){
  if(!file)return;const status=document.getElementById('reportStatus')||document.getElementById('importStatus');
  try{
    if(typeof XLSX==='undefined')throw new Error('Spreadsheet reader unavailable. Check your connection.');
    const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});let parsed=null,sheet='';
    for(const name of wb.SheetNames){const rows=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,defval:null,raw:true});if(kind==='customers'){parsed=validatedCustomerRows(rows);sheet=name;break;}if(kind==='ytd'){const columns=ytdColumns(rows);if(columns){parsed=parseYtdRows(rows,columns);sheet=name;break;}}else{try{parsed=transactionRows(rows);sheet=name;break;}catch(e){if(wb.SheetNames.length===1)throw e;}}}
    if(!parsed?.length)throw new Error('No matching report columns found.');
    const warnings=[],known=new Set((latestSnapshot()?.customers||[]).map(c=>String(c.customer).trim()));
    if(kind==='customers'){const date=document.getElementById('snapshotDate').value;if(!date||!reportDate(date)||date>isoToday())throw new Error('Choose a valid snapshot date up to today.');snapshots.push({id:Date.now(),date,filename:file.name,sheet,customers:parsed});storage.set('bdm_snapshots',snapshots);}
    if(kind==='ytd'){const missingNames=parsed.filter(c=>!c.name).length;if(missingNames)warnings.push(missingNames+' customers have no name in the YTD report.');const seen=new Set();parsed.forEach(c=>{if(seen.has(c.customer))throw new Error('Duplicate customer account '+c.customer);seen.add(c.customer);});ytdReport={customers:parsed,filename:file.name,sheet,uploadedAt:new Date().toISOString()};storage.set('bdm_ytd_report',ytdReport);}
    if(kind==='transactions'){const existing=new Map(recentTransactions.map(t=>[txKey(t),t]));let duplicates=0;parsed.forEach(t=>{if(existing.has(txKey(t)))duplicates++;else existing.set(txKey(t),t);});recentTransactions=[...existing.values()];storage.set('bdm_recent_transactions',recentTransactions);if(duplicates)warnings.push(duplicates+' duplicate transactions ignored.');}
    if(kind!=='customers'){const unmatched=parsed.filter(c=>!known.has(String(c.customerId??c.customer))).length;if(unmatched)warnings.push(unmatched+' rows have no matching customer snapshot.');}
    reportMetadata[kind]={filename:file.name,uploadedAt:new Date().toISOString(),rows:parsed.length,warnings};storage.set('bdm_report_metadata',reportMetadata);renderImport();
    document.getElementById('reportStatus').innerHTML=`<div class="success">Imported ${parsed.length} rows. ${warnings.map(esc).join(' ')}</div>`;
  }catch(e){status.innerHTML=`<div class="import-status error">${esc(e.message)}</div>`;}
}
const BACKUP_TYPES={bdm_call_priorities:'array',bdm_nurture_settings:'object',bdm_period_settings:'object',bdm_period_targets:'object',bdm_standard_contact_messages:'object',bdm_user_targets:'object',bdm_users:'array',bdm_snapshots:'array',bdm_activity:'array',bdm_leads:'array',bdm_followups:'array',bdm_recent_transactions:'array',bdm_daily_user_targets:'object',bdm_ytd_report:'object',bdm_report_metadata:'object',bdm_nurture_progress:'object',bdm_target_history:'object'};
function makeBackup(){if(cloud.enabled)return {app:'HANDSOME BDM',version:1,exportedAt:new Date().toISOString(),data:structuredClone(cloud.data)};const data={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith('bdm_')&&!['bdm_active_user','bdm_manager_session'].includes(k))data[k]=JSON.parse(localStorage.getItem(k));}return {app:'HANDSOME BDM',version:1,exportedAt:new Date().toISOString(),data};}
function validateBackup(b){
  if(b?.app!=='HANDSOME BDM'||b.version!==1||!b.data||Array.isArray(b.data))throw new Error('This is not a supported BDM backup.');
  if(!Array.isArray(b.data.bdm_users)||!b.data.bdm_users.some(u=>u.manager&&u.active!==false&&/^[a-f0-9]{64}$/i.test(u.pinHash||'')))throw new Error('Backup needs an active manager with a valid PIN.');
  for(const [key,value] of Object.entries(b.data)){if(!Object.hasOwn(BACKUP_TYPES,key))throw new Error('Unexpected backup key.');const type=BACKUP_TYPES[key];if(type==='array'&&!Array.isArray(value)||type==='object'&&(!value||typeof value!=='object'||Array.isArray(value)))throw new Error('Invalid backup data: '+key);}
  for(const k of ['bdm_snapshots','bdm_activity','bdm_leads','bdm_followups','bdm_recent_transactions'])if(b.data[k]?.some(v=>!v||typeof v!=='object'||Array.isArray(v)))throw new Error('Invalid record in '+k);
  if(b.data.bdm_snapshots?.some(s=>!Array.isArray(s.customers)))throw new Error('Invalid customer snapshot.');
  return b;
}
function downloadBackup(b,suffix=''){const url=URL.createObjectURL(new Blob([JSON.stringify(b,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='handsome-bdm-'+isoToday()+suffix+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function exportBackup(){downloadBackup(makeBackup());document.getElementById('backupStatus').textContent='Backup download started. Keep it private: it contains your customer data and PIN hashes.';}
async function restoreBackup(file){
  const status=document.getElementById('backupStatus');
  if(cloud.enabled){status.textContent='Shared restore must be reviewed before replacing depot data. Your backup is ready for migration.';return;}
  try{const b=validateBackup(JSON.parse(await file.text()));if(!confirm('Replace this browser’s BDM data with the backup from '+b.exportedAt+'? A copy of your current data will download first.'))return;const previous=makeBackup();downloadBackup(previous,'-before-restore');
    try{Object.keys(previous.data).forEach(k=>localStorage.removeItem(k));Object.entries(b.data).forEach(([k,v])=>storage.set(k,v));localStorage.removeItem('bdm_active_user');}catch(e){Object.keys(b.data).forEach(k=>localStorage.removeItem(k));Object.entries(previous.data).forEach(([k,v])=>storage.set(k,v));throw e;}
    location.reload();
  }catch(e){status.textContent='Restore failed: '+e.message;}
}
