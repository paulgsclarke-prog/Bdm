<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BDM Starter</title>
  <style>
[hidden]{display:none!important}

:root{
  --bg:#f1f1ef;
  --panel:#ffffff;
  --ink:#20201e;
  --muted:#6d6d68;
  --blue:#65717b;
  --teal:#777e72;
  --green:#58715e;
  --amber:#d6a62a;
  --orange:#c98327;
  --red:#b84b43;
  --line:#deded8;
  --shadow:0 8px 22px rgba(25,25,22,.10);
  --brand:#0f4a43;
  --charcoal:#20201e;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}
button,input,textarea{font:inherit}
button{cursor:pointer}
.app-shell{max-width:720px;margin:0 auto;min-height:100vh;padding-bottom:92px}
.topbar{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:20px 20px 12px;background:rgba(245,247,246,.96);backdrop-filter:blur(8px)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--teal)}
h1{font-size:30px;margin:3px 0 0} h2{font-size:20px;margin:0}
.icon-btn{width:46px;height:46px;border:0;border-radius:15px;background:var(--panel);box-shadow:var(--shadow);font-size:24px;color:var(--ink)}
main{padding:8px 18px 24px}
.hero{background:linear-gradient(135deg,#dcefe9,#eef6f4);border-radius:28px;padding:24px;display:flex;align-items:end;justify-content:space-between;gap:16px;box-shadow:var(--shadow)}
.hero-number{font-size:54px;line-height:.95;font-weight:800}
.hero-label{margin-top:8px;color:#4f6560;max-width:190px;font-weight:600}
.primary-btn{border:0;border-radius:16px;padding:15px 18px;background:var(--ink);color:white;font-weight:800}
.stats-grid,.action-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.stat-card,.action-card{border:0;text-align:left;background:var(--panel);border-radius:22px;padding:18px;box-shadow:var(--shadow);color:var(--ink)}
.stat-card{border-top:5px solid var(--blue);min-height:132px}
.stat-card.urgent{border-color:var(--red)} .stat-card.warning{border-color:var(--amber)} .stat-card.positive{border-color:var(--teal)} .stat-card.neutral{border-color:var(--blue)}
.stat-card .big{display:block;font-size:34px;font-weight:800;margin-bottom:3px}
.stat-card span:not(.big){font-weight:800;display:block}.stat-card small,.action-card small{display:block;color:var(--muted);margin-top:5px}
.section{margin-top:28px}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.action-card span{display:block;font-size:28px;margin-bottom:14px}.action-card b{display:block}
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(720px,100%);display:grid;grid-template-columns:repeat(4,1fr);padding:10px 12px 14px;background:rgba(255,255,255,.96);border-top:1px solid var(--line);backdrop-filter:blur(8px);z-index:10}
.nav-btn{border:0;background:none;color:#83918d;padding:4px}.nav-btn span{display:block;font-size:23px;line-height:1}.nav-btn small{display:block;margin-top:5px}.nav-btn.active{color:var(--teal);font-weight:800}
.list{display:grid;gap:12px}.group-card,.report-card,.history-card,.customer-card,.form-card{background:var(--panel);border-radius:22px;padding:18px;box-shadow:var(--shadow)}
.group-card,.report-card{border:0;text-align:left;color:var(--ink);width:100%}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.badge{display:inline-block;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:800;background:#edf2f0;color:#48615a}
.badge.red{background:#fae8e8;color:#9d4040}.badge.amber{background:#edf3f1;color:#3e5e57}.badge.green{background:#e4f3e7;color:#397246}.badge.blue{background:#e8f0fa;color:#3f6389}
.metric{font-size:28px;font-weight:800}.muted{color:var(--muted)} .sub{font-size:13px;color:var(--muted)}
.customer-card h2{font-size:27px;margin-bottom:2px}.phone{display:block;margin:14px 0;background:#e6f3ef;border-radius:16px;padding:15px;text-align:center;font-size:22px;font-weight:800;color:#2c6f63;text-decoration:none}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fact{background:#f6f8f7;border-radius:16px;padding:12px}.fact b{display:block;font-size:17px}.fact small{color:var(--muted)}
.offer{margin-top:14px;padding:14px;border-radius:16px;background:#edf3f1;border:1px solid #d7e4e0}.offer b{display:block}
.progress{height:8px;background:#e7eeeb;border-radius:999px;overflow:hidden;margin:12px 0 20px}.progress > div{height:100%;background:var(--teal)}
.quick-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.quick-actions button,.wide-btn{border:0;border-radius:16px;padding:16px;font-weight:800;background:#edf2f0;color:var(--ink)}.quick-actions .good{background:#dff0eb;color:#28675d}.quick-actions .warn{background:#edf3f1;color:#3e5e57}.quick-actions .bad{background:#f8e6e6;color:#9a4242}.wide-btn{width:100%;margin-top:10px;background:var(--ink);color:white}
.field{margin-top:13px}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:6px;color:#50655f}.field input,.field textarea,.field select{width:100%;border:1px solid #dce5e1;border-radius:14px;padding:13px;background:white;color:var(--ink)}textarea{min-height:90px;resize:vertical}
.pill-row{display:flex;flex-wrap:wrap;gap:8px}.pill{border:1px solid #dce5e1;background:white;border-radius:999px;padding:10px 12px}.pill.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.success{padding:16px;border-radius:18px;background:#e2f3ea;color:#2d6a50;font-weight:800;margin-bottom:15px}
@media (max-width:430px){.hero{align-items:stretch;flex-direction:column}.primary-btn{width:100%}.stats-grid,.action-grid{grid-template-columns:1fr 1fr}.facts{grid-template-columns:1fr 1fr}}

.file-drop{display:block;border:2px dashed #cddbd6;border-radius:20px;padding:24px;text-align:center;background:#fbfcfc;margin-top:14px}
.file-drop input{display:none}
.file-drop b{display:block;font-size:18px;margin-bottom:4px}
.import-status{margin-top:14px;padding:14px;border-radius:16px;background:#eef5f3;color:#345f56}
.import-status.error{background:#f8e7e7;color:#8d4242}
.snapshot-card{background:#fff;border-radius:18px;padding:14px 16px;box-shadow:var(--shadow);margin-top:10px}
.snapshot-card .row{align-items:flex-start}
.kpi-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.kpi-mini{background:#f4f7f6;border-radius:14px;padding:10px;text-align:center}
.kpi-mini b{display:block;font-size:20px}
.kpi-mini small{color:var(--muted)}

/* V3 mobile dashboard */
.dashboard-block{margin-top:18px}
.dashboard-title{font-size:15px;font-weight:800;color:var(--muted);margin:0 0 10px 2px}
.kpi-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi-card{background:var(--panel);border:0;border-radius:20px;padding:16px;text-align:left;box-shadow:var(--shadow);color:var(--ink);min-height:108px}
.kpi-card .kpi-value{font-size:29px;line-height:1;font-weight:850;display:block;margin-bottom:7px}
.kpi-card .kpi-label{font-size:14px;font-weight:800;display:block}
.kpi-card .kpi-sub{font-size:12px;color:var(--muted);margin-top:4px;display:block}
.kpi-card.alert{border-left:5px solid var(--red)}
.kpi-card.warn{border-left:5px solid var(--amber)}
.kpi-card.good{border-left:5px solid var(--teal)}
.kpi-card.blue{border-left:5px solid var(--blue)}
.lead-summary{display:grid;grid-template-columns:1fr;gap:10px}
.lead-row{background:var(--panel);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow)}
.lead-row .bar-wrap{height:9px;background:#edf2f0;border-radius:999px;overflow:hidden;margin-top:9px}
.lead-row .bar{height:100%;background:var(--teal);border-radius:999px}
.top-summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.top-summary .summary-tile{background:rgba(255,255,255,.8);border-radius:18px;padding:14px}
.summary-tile b{font-size:24px;display:block}
.summary-tile small{color:var(--muted)}
.lead-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.badge.overdue{background:#fae8e8;color:#9d4040}
.badge.today{background:#edf3f1;color:#3e5e57}
.badge.open{background:#e8f0fa;color:#3f6389}
@media (max-width:520px){
  .app-shell{max-width:none}
  .topbar{padding:15px 14px 10px}
  main{padding:6px 12px 20px}
  h1{font-size:26px}
  .hero{border-radius:22px;padding:18px}
  .hero-number{font-size:46px}
  .stats-grid,.action-grid,.kpi-grid{grid-template-columns:1fr 1fr;gap:9px}
  .stat-card,.action-card,.kpi-card{border-radius:18px;padding:14px}
  .stat-card{min-height:118px}
  .action-card{min-height:110px}
  .customer-card,.form-card,.group-card,.report-card,.history-card{border-radius:18px;padding:15px}
  .phone{font-size:20px}
  .bottom-nav{padding-bottom:max(12px,env(safe-area-inset-bottom))}
}
@media (max-width:360px){
  .kpi-grid,.stats-grid,.action-grid{grid-template-columns:1fr}
  .facts,.lead-form-grid{grid-template-columns:1fr}
}

/* V4 */
.period-banner{background:var(--ink);color:#fff;border-radius:22px;padding:17px 18px;margin-bottom:12px;box-shadow:var(--shadow)}
.period-banner .period-code{font-size:28px;font-weight:900}.period-banner .period-dates{font-size:12px;opacity:.72;margin-top:3px}.action-lanes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}.action-lane{border:0;border-radius:22px;padding:18px;text-align:left;box-shadow:var(--shadow);color:var(--ink);min-height:155px}.action-lane.follow{background:#eef4f2;border-bottom:5px solid #6d8e86}.action-lane.calls{background:#e7f3f0;border-bottom:5px solid var(--teal)}.action-lane .lane-icon{font-size:28px;display:block;margin-bottom:10px}.action-lane .lane-value{font-size:35px;line-height:1;font-weight:900;display:block}.action-lane .lane-label{display:block;font-size:16px;font-weight:850;margin-top:7px}.action-lane .lane-sub{display:block;font-size:12px;color:var(--muted);margin-top:4px}.period-table{display:grid;gap:9px}.period-row{background:var(--panel);border-radius:18px;padding:14px 15px;box-shadow:var(--shadow)}.period-row.current{border-left:5px solid var(--teal)}.period-row .period-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.period-row .period-name{font-weight:900}.period-row .period-values{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.period-row .period-values div{background:#f5f8f7;border-radius:12px;padding:9px}.period-row .period-values b{display:block;font-size:16px}.period-row .period-values small{color:var(--muted);font-size:11px}.category-grid{display:grid;grid-template-columns:1fr;gap:8px}.category-row{background:var(--panel);border-radius:17px;padding:13px 14px;box-shadow:var(--shadow)}.category-row .category-stats{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px}.category-row .category-stats span{font-size:12px;color:var(--muted)}.category-row .category-stats b{color:var(--ink)}.lead-period{font-size:12px;font-weight:800;color:var(--teal)}
@media(max-width:420px){.action-lanes{grid-template-columns:1fr 1fr}.action-lane{padding:15px;min-height:145px}.action-lane .lane-value{font-size:32px}.period-row .period-values{grid-template-columns:1fr 1fr 1fr}}
@media(max-width:340px){.action-lanes{grid-template-columns:1fr}}

/* V5 navigation + settings */
.settings-card{background:var(--panel);border-radius:20px;padding:16px;box-shadow:var(--shadow);margin-top:12px}
.message-card{background:#eef6f3;border:1px solid #dcebe6;border-radius:18px;padding:14px;margin-top:10px}
.message-card b{display:block;margin-bottom:4px}
.call-category-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.call-category{border:0;border-radius:20px;padding:16px;text-align:left;box-shadow:var(--shadow);background:var(--panel);color:var(--ink);min-height:125px}
.call-category .count{font-size:31px;font-weight:900;display:block}
.call-category .name{font-weight:850;display:block;margin-top:5px}
.call-category .msg{font-size:12px;color:var(--muted);display:block;margin-top:5px}
.toolbar{display:flex;gap:8px;overflow:auto;padding-bottom:3px;margin-bottom:12px}
.filter-btn{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:9px 12px;white-space:nowrap;color:var(--ink);font-weight:750}
.filter-btn.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.stat-section{margin-top:18px}
.stat-section-title{font-size:14px;font-weight:850;color:var(--muted);margin:0 0 9px 2px}
.metric-stack{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.metric-box{background:var(--panel);border-radius:18px;padding:15px;box-shadow:var(--shadow)}
.metric-box b{font-size:28px;display:block;line-height:1.05}
.metric-box span{font-size:13px;font-weight:800;display:block;margin-top:6px}
.metric-box small{color:var(--muted);display:block;margin-top:3px}
.small-note{font-size:11px;color:var(--muted)}
.setting-row{margin-top:12px}
.setting-row label{font-size:12px;font-weight:800;display:block;margin-bottom:5px;color:var(--muted)}
.setting-row textarea,.setting-row input{width:100%;border:1px solid #dce5e1;border-radius:14px;padding:12px;background:#fff;color:var(--ink)}
.settings-actions{display:flex;gap:8px;margin-top:12px}
.settings-actions button{flex:1;border:0;border-radius:14px;padding:12px;font-weight:850}
.settings-actions .save{background:var(--ink);color:#fff}
.settings-actions .close{background:#edf2f0;color:var(--ink)}
.header-tools{display:flex;gap:8px;align-items:center}
@media (max-width:420px){
  .call-category-grid,.metric-stack{grid-template-columns:1fr 1fr}
}
@media (max-width:340px){
  .call-category-grid,.metric-stack{grid-template-columns:1fr}
}

/* V6 HANDSOME trade theme + multi-user PIN */
body{background:#efefec}
.topbar{background:rgba(32,32,30,.97);color:#fff;border-bottom:4px solid #0f4a43}
.eyebrow{color:#d8d8d3}
.topbar h1{color:#fff}
.brand-block{min-width:0}
.brand-word{display:inline-block;background:#0f4a43;color:#fff;font-weight:950;letter-spacing:.12em;padding:5px 8px;border-radius:3px;font-size:13px}
.icon-btn{background:#343431;color:#fff;box-shadow:none;border:1px solid #4a4a46}
.bottom-nav{background:#20201ef5;border-top:3px solid #0f4a43}
.nav-btn{color:#bbbcb6}
.nav-btn.active{color:#b8d0ca}
.primary-btn,.wide-btn,.filter-btn.active,.settings-actions .save{background:var(--charcoal);color:#fff}
.stat-card,.kpi-card,.action-card,.group-card,.call-category,.history-card,.form-card,.settings-card,.report-card{border:1px solid #e4e4df}
.period-banner{background:#20201e;border-top:4px solid var(--brand)}
.badge.green{background:#e4efe7;color:#385742}
.badge.amber{background:#edf3f1;color:#3e5e57}
.badge.red{background:#f7e4e2;color:#843b35}
.badge.blue{background:#e8eaec;color:#4a555f}
.manager-only{display:none}
body.manager-session .manager-only{display:block!important}
body.manager-session .bottom-nav{grid-template-columns:repeat(5,1fr)}
body:not(.manager-session) .bottom-nav{grid-template-columns:repeat(4,1fr)}
.nav-btn small{font-size:10px}
.user-chip{display:inline-flex;align-items:center;gap:7px;background:#343431;color:#fff;border:1px solid #494944;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:800}
.user-chip .manager-star{color:#b8d0ca}
.audit-line{margin-top:10px;padding-top:9px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}
.audit-line b{color:var(--ink)}
.user-list{display:grid;gap:10px;margin-top:12px}
.user-card{background:#fff;border:1px solid #e2e2dd;border-radius:17px;padding:13px 14px}
.user-card .role{font-size:11px;font-weight:850;color:#6d6d68}
.manager-summary{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.manager-user-card{background:#fff;border-radius:18px;padding:14px;border:1px solid #e2e2dd;box-shadow:var(--shadow)}
.manager-user-card h3{margin:0 0 8px;font-size:17px}
.manager-user-card .mini-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.manager-user-card .mini{background:#f5f5f2;border-radius:11px;padding:8px}
.manager-user-card .mini b{display:block;font-size:17px}
.manager-user-card .mini small{font-size:10px;color:var(--muted)}
.pin-modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.64);display:flex;align-items:flex-end;justify-content:center;padding:0}
.pin-modal.hidden{display:none}
.pin-sheet{width:min(520px,100%);background:#f4f4f1;border-radius:26px 26px 0 0;padding:20px 18px max(20px,env(safe-area-inset-bottom));box-shadow:0 -10px 30px rgba(0,0,0,.25)}
.pin-brand{display:inline-block;background:#0f4a43;color:#fff;font-weight:950;letter-spacing:.12em;padding:5px 8px;border-radius:3px;font-size:12px;margin-bottom:12px}
.pin-sheet h2{margin:0 0 3px;font-size:24px}
.pin-user-row{margin-top:14px}
.pin-user-row select{width:100%;padding:13px;border-radius:14px;border:1px solid #d5d5cf;background:#fff;font-weight:800}
.pin-dots{display:flex;justify-content:center;gap:16px;margin:22px 0 14px}
.pin-dots span{width:16px;height:16px;border:2px solid #777;border-radius:50%;background:transparent}
.pin-dots span.filled{background:#20201e;border-color:#20201e}
.pin-error{min-height:18px;text-align:center;color:var(--red);font-size:12px;font-weight:800}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:8px}
.pin-pad button{height:58px;border:0;border-radius:16px;background:#fff;font-size:22px;font-weight:850;color:#20201e;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.pin-pad button:active{transform:scale(.98);background:#ecece7}
.pin-cancel{width:100%;margin-top:10px;border:0;background:transparent;padding:12px;color:#6d6d68;font-weight:800}
.user-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.permission-toggle{display:flex;align-items:center;justify-content:space-between;background:#f5f5f2;border-radius:14px;padding:12px;margin-top:10px}
.permission-toggle input{width:22px;height:22px}
.call-owner-note{font-size:11px;color:var(--muted);margin-top:4px}
@media (max-width:420px){
  .pin-sheet{padding-left:14px;padding-right:14px}
  .pin-pad button{height:56px}
  .manager-summary{grid-template-columns:1fr}
  body.manager-session .nav-btn small{font-size:9px}
}

:root{
  --deep-green:#0f4a43;
  --mid-green:#3e6f66;
  --pale-green:#e9f0ee;
  --soft-grey:#f2f3f1;
}
.topbar{background:#1f2523}
.brand-word{background:var(--deep-green);color:#fff;letter-spacing:.10em}
.bottom-nav{background:#1f2523f5;border-top-color:var(--deep-green)}
.nav-btn.active{color:#b7d0ca}
.period-banner{background:#1f2523;border-top:4px solid var(--deep-green)}
.primary-btn,.wide-btn,.filter-btn.active,.settings-actions .save{background:var(--deep-green)}
.badge.amber,.badge.today{background:#edf3f1;color:#3e5e57}
.action-lane.follow{background:#eef4f2;border-bottom-color:#6d8e86}
.action-lane.calls{background:#e7f0ed;border-bottom-color:#3e6f66}
.pin-brand{background:var(--deep-green);color:#fff}
.manager-star{color:#b7d0ca}
.priority-list{display:grid;gap:8px;margin-top:12px}
.priority-item{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;background:#fff;border:1px solid #dde4e1;border-radius:16px;padding:12px}
.priority-rank{width:32px;height:32px;border-radius:10px;background:#e8efed;display:flex;align-items:center;justify-content:center;font-weight:900;color:#2f5c54}
.priority-text b{display:block;font-size:14px}
.priority-text small{display:block;color:var(--muted);margin-top:2px}
.priority-controls{display:flex;gap:5px}
.priority-controls button{width:34px;height:34px;border:0;border-radius:10px;background:#edf1ef;color:#2d4741;font-weight:900}
.analytics-bars{display:grid;gap:8px}
.analytics-row{display:grid;grid-template-columns:62px 1fr 46px;gap:8px;align-items:center}
.analytics-row .bar-track{height:12px;background:#e5e8e6;border-radius:999px;overflow:hidden}
.analytics-row .bar-fill{height:100%;background:#3e6f66;border-radius:999px}
.analytics-row .bar-fill.success{background:#0f4a43}
.duration-quick{display:flex;flex-wrap:wrap;gap:7px;margin-top:7px}
.duration-quick button{border:1px solid #dce4e1;background:#fff;border-radius:999px;padding:8px 10px;font-weight:800;color:#365b54}
.duration-quick button.active{background:#0f4a43;color:#fff;border-color:#0f4a43}

/* =========================================================
   V9 — HANDSOME / Howdens-inspired trade theme
   Palette derived from Howdens published brand guidance:
   red #D22630, black #000000, grey #646363, white #FFFFFF,
   cream #F5F0E3, dark blue-grey #28343C.
   No Howdens logo or artwork is used.
   ========================================================= */

:root{
  --bg:#F5F0E3;
  --panel:#FFFFFF;
  --ink:#000000;
  --muted:#646363;
  --blue:#28343C;
  --teal:#646363;
  --green:#646363;
  --amber:#646363;
  --orange:#D22630;
  --red:#D22630;
  --line:#D7D4CC;
  --shadow:0 2px 8px rgba(0,0,0,.10);
  --brand:#D22630;
  --charcoal:#000000;
  --deep-green:#000000;
  --mid-green:#646363;
  --pale-green:#F1F1EF;
  --soft-grey:#F1F1EF;
}

body{
  background:#F5F0E3;
  color:#000;
}

.app-shell{
  background:#F5F0E3;
}

/* Header / wordmark */
.topbar{
  background:#FFFFFF;
  color:#000;
  border-top:7px solid #D22630;
  border-bottom:1px solid #D7D4CC;
  box-shadow:0 2px 5px rgba(0,0,0,.06);
  backdrop-filter:none;
}
.brand-word{
  background:transparent;
  color:#000;
  padding:0;
  border-radius:0;
  font-size:20px;
  line-height:1;
  font-weight:950;
  letter-spacing:.035em;
  position:relative;
}
.brand-word::after{
  content:"";
  display:block;
  width:38px;
  height:4px;
  background:#D22630;
  margin-top:5px;
}
.eyebrow{
  color:#646363;
  font-weight:700;
  letter-spacing:.08em;
  margin-top:6px;
}
.topbar h1{
  color:#000;
}
.icon-btn{
  background:#F1F1EF;
  border:1px solid #D0CEC7;
  color:#000;
  box-shadow:none;
  border-radius:4px;
}

/* Main navigation */
.bottom-nav{
  background:#FFFFFF;
  border-top:2px solid #000;
  box-shadow:0 -2px 8px rgba(0,0,0,.08);
  backdrop-filter:none;
}
.nav-btn{
  color:#646363;
}
.nav-btn.active{
  color:#D22630;
  font-weight:900;
}
.nav-btn.active span{
  color:#D22630;
}

/* Period header */
.period-banner{
  background:#28343C;
  color:#FFF;
  border:0;
  border-left:7px solid #D22630;
  border-radius:4px;
  box-shadow:none;
}
.period-banner .period-code{
  font-weight:950;
}
.period-banner .period-dates{
  color:#E5E5E3;
  opacity:1;
}

/* Generic cards: flatter, squarer and more trade / corporate */
.stat-card,.action-card,.kpi-card,.lead-row,.period-row,.category-row,
.group-card,.report-card,.history-card,.customer-card,.form-card,
.settings-card,.snapshot-card,.call-category,.manager-user-card,
.metric-box,.user-card{
  border-radius:6px;
  box-shadow:0 1px 4px rgba(0,0,0,.09);
  border:1px solid #D7D4CC;
  background:#FFF;
}

.dashboard-title,.stat-section-title{
  color:#000;
  font-weight:900;
}

/* Action cards */
.action-lane{
  border-radius:6px;
  box-shadow:none;
}
.action-lane.calls{
  background:#FFF;
  border:1px solid #D7D4CC;
  border-left:6px solid #D22630;
}
.action-lane.follow{
  background:#F1F1EF;
  border:1px solid #D7D4CC;
  border-left:6px solid #646363;
}
.action-lane .lane-icon{
  color:#D22630;
}

/* KPI accents */
.kpi-card.good,.kpi-card.blue,.kpi-card.warn{
  border-left:5px solid #646363;
}
.kpi-card.alert{
  border-left:5px solid #D22630;
}
.kpi-card .kpi-value{
  color:#000;
}

/* Priority / status cards */
.stat-card{
  border-top:0;
  border-left:5px solid #646363;
}
.stat-card.urgent{
  border-left-color:#D22630;
}
.stat-card.warning{
  border-left-color:#646363;
}
.stat-card.positive{
  border-left-color:#28343C;
}
.stat-card.neutral{
  border-left-color:#9D9B97;
}

/* Buttons */
.primary-btn,.wide-btn,.settings-actions .save{
  background:#000;
  color:#FFF;
  border-radius:4px;
}
.primary-btn:active,.wide-btn:active,.settings-actions .save:active{
  background:#D22630;
}
.filter-btn{
  border-radius:3px;
  background:#FFF;
  border:1px solid #AFAEAA;
  color:#000;
}
.filter-btn.active{
  background:#D22630;
  color:#FFF;
  border-color:#D22630;
}
.quick-actions button{
  border-radius:4px;
}
.quick-actions .good{
  background:#28343C;
  color:#FFF;
}
.quick-actions .warn{
  background:#F1F1EF;
  color:#000;
  border:1px solid #AFAEAA;
}
.quick-actions .bad{
  background:#D22630;
  color:#FFF;
}

/* Badges */
.badge{
  border-radius:3px;
  background:#F1F1EF;
  color:#000;
}
.badge.red,.badge.overdue{
  background:#D22630;
  color:#FFF;
}
.badge.amber,.badge.today{
  background:#646363;
  color:#FFF;
}
.badge.green{
  background:#28343C;
  color:#FFF;
}
.badge.blue,.badge.open{
  background:#E6E7E7;
  color:#000;
}

/* Forms */
.field label,.setting-row label{
  color:#000;
}
.field input,.field textarea,.field select,
.setting-row textarea,.setting-row input,
.pin-user-row select{
  border-radius:3px;
  border:1px solid #AFAEAA;
  background:#FFF;
}
.field input:focus,.field textarea:focus,.field select:focus,
.setting-row textarea:focus,.setting-row input:focus{
  outline:2px solid #D22630;
  outline-offset:1px;
}

/* Customer details */
.phone{
  background:#28343C;
  color:#FFF;
  border-radius:4px;
}
.fact{
  background:#F1F1EF;
  border-radius:4px;
}
.offer,.message-card{
  background:#F5F0E3;
  border:1px solid #D7D4CC;
  border-left:5px solid #D22630;
  border-radius:4px;
}
.progress{
  background:#D9D9D6;
}
.progress > div{
  background:#D22630;
}

/* Tables / period rows */
.period-row.current{
  border-left:6px solid #D22630;
}
.required-chip{
  background:#F1F1EF;
  color:#000;
  border-radius:3px;
}
.lead-period{
  color:#D22630;
}

/* Priority editor */
.priority-item{
  border-radius:4px;
  border:1px solid #D7D4CC;
}
.priority-rank{
  background:#D22630;
  color:#FFF;
  border-radius:3px;
}
.priority-controls button{
  background:#28343C;
  color:#FFF;
  border-radius:3px;
}

/* Charts */
.analytics-row .bar-track{
  background:#E2E2DF;
}
.analytics-row .bar-fill{
  background:#646363;
}
.analytics-row .bar-fill.success{
  background:#D22630;
}

/* PIN */
.pin-sheet{
  background:#F5F0E3;
  border-radius:10px 10px 0 0;
}
.pin-brand{
  background:transparent;
  color:#000;
  padding:0;
  font-size:18px;
  letter-spacing:.035em;
}
.pin-brand::after{
  content:"";
  display:block;
  width:34px;
  height:4px;
  background:#D22630;
  margin-top:5px;
}
.pin-dots span.filled{
  background:#D22630;
  border-color:#D22630;
}
.pin-pad button{
  border-radius:4px;
  border:1px solid #D7D4CC;
  box-shadow:none;
}
.pin-pad button:active{
  background:#D22630;
  color:#FFF;
}

/* User / manager */
.user-chip{
  background:#FFF;
  color:#000;
  border:1px solid #C9C7C0;
  border-radius:3px;
}
.manager-star{
  color:#D22630;
}

/* Call duration */
.duration-quick button{
  border-radius:3px;
  color:#000;
  border:1px solid #AFAEAA;
}
.duration-quick button.active{
  background:#D22630;
  color:#FFF;
  border-color:#D22630;
}

/* Success and import states */
.success{
  background:#F1F1EF;
  color:#000;
  border-left:5px solid #28343C;
  border-radius:4px;
}
.import-status{
  background:#F1F1EF;
  color:#000;
  border-left:5px solid #28343C;
  border-radius:4px;
}
.import-status.error{
  background:#FFF;
  color:#A21F28;
  border-left-color:#D22630;
}
.file-drop{
  background:#FFF;
  border:2px dashed #646363;
  border-radius:4px;
}

/* Remove remaining overly rounded visual language */
.pill,.required-chip,.user-chip,.badge{
  border-radius:3px;
}
.bar-wrap,.bar,.bar-track,.bar-fill,.progress,.progress>div{
  border-radius:1px;
}

@media (max-width:520px){
  .topbar{padding-top:14px}
  .brand-word{font-size:18px}
  .period-banner,.customer-card,.form-card,.group-card,.report-card,
  .history-card,.kpi-card,.stat-card,.action-card,.call-category{
    border-radius:5px;
  }
}

/* V10 workflow / targets / manager intelligence */
.stage-badge{display:inline-block;padding:5px 8px;border-radius:3px;font-size:11px;font-weight:900;background:#ECECEC;color:#000}
.stage-open{background:#E7E7E7}
.stage-contacted{background:#D9DEE0}
.stage-quoted{background:#D7E0E5}
.stage-awaiting{background:#E7E1D8}

.stage-lost{background:#D22630;color:#fff}

.target-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.target-card{background:#fff;border:1px solid #D7D4CC;border-radius:5px;padding:14px}

.target-progress{height:9px;background:#E2E2DF;margin-top:8px;overflow:hidden}

.intervention-card small{color:var(--muted)}
.score-pill{display:inline-block;min-width:46px;text-align:center;padding:5px 7px;background:#28343C;color:#fff;font-weight:900;border-radius:3px}

.metric-table{width:100%;border-collapse:collapse;background:#fff;border:1px solid #D7D4CC}

.segment-tabs{display:flex;gap:7px;overflow:auto;margin-bottom:10px}

.quick-note-btn.active{background:#28343C;color:#FFF;border-color:#28343C}
.quick-note-btn:active{border-color:#D22630}

.nurture-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}

.nurture-card.priority{border-left-color:#d22630}.nurture-card.danger{border-left-color:#d22630}
.nurture-card b{font-size:26px;display:block}.nurture-card span{display:block;font-weight:900;margin-top:3px}.nurture-card small{display:block;color:#646363;margin-top:3px}

.workflow-detail{margin-top:10px;padding:11px;background:#f1f1ef;border-left:4px solid #28343c}.workflow-detail.danger{border-left-color:#d22630}.workflow-detail b,.workflow-detail span{display:block}.workflow-detail span{font-size:12px;color:#646363;margin-top:4px}
.streak-strip{display:flex;justify-content:space-between;margin-top:10px;padding:10px 12px;background:#fff;border:1px solid #d7d4cc}

/* V14 faster calling workflow */
.call-action-panel{margin:12px 0 14px;padding:12px;border:1px solid #d7d4cc;border-radius:6px;background:#f7f7f4}
.call-action-panel>small{display:block;font-size:10px;font-weight:900;letter-spacing:.08em;color:#646363;margin-bottom:8px}
.call-action-panel .quick-actions{margin:0}
.call-action-panel .quick-actions button{min-height:52px;border-radius:5px}
.call-action-panel .quick-actions .good{background:#0f4a43;color:#fff}
.call-action-panel .quick-actions .warn{background:#ece9df;color:#20201e}
.call-timer-note{margin:8px 0 0;font-size:11px;color:#646363;text-align:center}
.customer-detail-toggle{width:100%;margin:10px 0 0;border:1px solid #d7d4cc;border-radius:4px;background:#fff;color:#20201e;padding:10px 12px;font-weight:750;text-align:left}
.customer-detail-secondary[hidden]{display:none!important}
.outcome-customer-strip{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#f1f1ef;border-radius:4px;padding:10px 11px;margin-bottom:10px}
.outcome-customer-strip b{font-size:14px}.outcome-customer-strip span{font-size:11px;color:#646363}


/* V15 actionable manager dashboard */
.manager-action-row{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}
.manager-action-row button{border:1px solid #d7d4cc;border-radius:4px;background:#fff;color:#20201e;padding:10px 8px;font-weight:800;font-size:12px}
.manager-action-row button.primary{background:#0f4a43;color:#fff;border-color:#0f4a43}
.manager-attention{display:grid;gap:8px}
.manager-attention-card{border:1px solid #d7d4cc;border-left:4px solid #b31f28;border-radius:5px;background:#fff;padding:12px}
.manager-attention-card.warning{border-left-color:#b78625}
.manager-attention-card .row{align-items:flex-start}
.manager-attention-card b{display:block}.manager-attention-card small{display:block;color:#646363;margin-top:3px;line-height:1.4}
.manager-staff-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.manager-staff-head button{border:0;background:#edf2f0;border-radius:4px;padding:8px 10px;font-weight:800}
.manager-lead-list .history-card{padding:13px}


/* V16 manager performance funnel */
.manager-funnel{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
.manager-funnel-step{background:#fff;border:1px solid #d7d4cc;border-radius:5px;padding:10px;text-align:center;min-width:0}
.manager-funnel-step b{display:block;font-size:22px;line-height:1}
.manager-funnel-step span{display:block;font-size:11px;font-weight:800;margin-top:6px}
.manager-funnel-step small{display:block;font-size:10px;color:#646363;margin-top:3px}
.loss-reason-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid #e4e2dc}
.loss-reason-row:last-child{border-bottom:0}
.loss-reason-row b{font-size:13px}.loss-reason-row span{font-weight:900}
@media(max-width:430px){.manager-funnel{grid-template-columns:1fr 1fr}}


/* V17 database change intelligence */
.change-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.change-card{border:1px solid #d7d4cc;border-radius:6px;background:#fff;color:#20201e;padding:13px;text-align:left;min-width:0}
.change-card b{display:block;font-size:26px;line-height:1}
.change-card span{display:block;font-weight:850;font-size:13px;margin-top:7px}
.change-card small{display:block;color:#646363;font-size:11px;line-height:1.35;margin-top:4px}
.change-card.alert{border-left:4px solid #b31f28}.change-card.good{border-left:4px solid #0f4a43}.change-card.warn{border-left:4px solid #b78625}
.change-list-item{border:1px solid #d7d4cc;border-radius:5px;background:#fff;padding:12px;margin-top:8px}
.change-delta{font-weight:900}.change-delta.up{color:#246243}.change-delta.down{color:#a02d34}
@media(max-width:360px){.change-grid{grid-template-columns:1fr}}


/* V18 target achievement history */
.target-complete-banner{border:1px solid #b7d0ca;border-left:5px solid #0f4a43;border-radius:6px;background:#eef5f3;padding:12px 14px;margin-top:10px}
.target-complete-banner b{display:block}.target-complete-banner small{display:block;color:#49635d;margin-top:4px}
.target-history-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid #e4e2dc}
.target-history-row:last-child{border-bottom:0}
.target-history-dot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#e7e7e2;font-weight:900}
.target-history-dot.hit{background:#dfeee9;color:#0f4a43}
.target-history-row small{display:block;color:#646363;margin-top:3px}


/* V19 survey opportunities + workflow performance */
.workflow-table{width:100%;border-collapse:collapse;font-size:12px}
.workflow-table th,.workflow-table td{text-align:left;padding:9px 6px;border-bottom:1px solid #e4e2dc}
.workflow-table th{color:#646363;font-size:10px;text-transform:uppercase;letter-spacing:.04em}
.workflow-table td:nth-child(n+2),.workflow-table th:nth-child(n+2){text-align:right}
.survey-card{border:1px solid #d7d4cc;border-left:4px solid #0f4a43;border-radius:6px;background:#fff;padding:13px;margin-bottom:10px}
.survey-card b{display:block}.survey-card small{display:block;color:#646363;margin-top:4px}


/* V20 mobile navigation polish */
.queue-top-actions{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.queue-exit{border:1px solid #d7d4cc;border-radius:4px;background:#fff;color:#20201e;padding:9px 11px;font-weight:800;font-size:12px}
.queue-position{font-size:12px;color:#646363}
@media(max-width:430px){
  button,.filter-btn,.nav-btn,.icon-btn{touch-action:manipulation}
  .filter-btn{min-height:42px}
  .quick-actions button{min-height:54px}
  .wide-btn{min-height:50px}
  .bottom-nav .nav-btn{min-height:52px}
  .bottom-nav .nav-btn span{font-size:21px}
  .bottom-nav .nav-btn small{font-size:10px}
}


/* V21 lead search + ownership filter */
.lead-search-panel{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;margin:0 0 12px}
.lead-search-panel input,.lead-search-panel select{min-height:44px;border:1px solid #afaeaa;border-radius:4px;background:#fff;color:#20201e;padding:10px 11px;font:inherit}
.lead-search-panel input{width:100%;min-width:0}
.lead-search-empty{background:#fff;border:1px solid #d7d4cc;border-radius:5px;padding:16px;color:#646363}
@media(max-width:430px){.lead-search-panel{grid-template-columns:1fr}.lead-search-panel select{width:100%}}


/* V22 unified customer record */
.customer-record-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.customer-record-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
.customer-record-actions button,.customer-record-actions a{min-height:46px;border:1px solid #d7d4cc;border-radius:5px;background:#fff;color:#20201e;padding:11px;text-align:center;text-decoration:none;font-weight:850}
.customer-record-actions .primary{background:#0f4a43;color:#fff;border-color:#0f4a43}
.customer-record-section{margin-top:14px}
.customer-record-list{display:grid;gap:8px;margin-top:8px}
.customer-record-item{border:1px solid #e0ddd6;border-radius:5px;background:#fff;padding:11px}
.customer-record-item b{display:block}.customer-record-item small{display:block;color:#646363;margin-top:4px;line-height:1.35}
.customer-record-summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.customer-record-summary .fact{min-width:0}
@media(max-width:360px){.customer-record-actions{grid-template-columns:1fr}.customer-record-summary{grid-template-columns:1fr 1fr}}


/* V23 manager campaigns */
.campaign-card{border:1px solid #d7d4cc;border-radius:6px;background:#fff;padding:13px;margin-top:9px}
.campaign-card h3{margin:0;font-size:16px}.campaign-card small{display:block;color:#646363;margin-top:4px;line-height:1.35}
.campaign-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}
.campaign-actions button{border:1px solid #d7d4cc;border-radius:4px;background:#fff;padding:10px;font-weight:800}
.campaign-actions .primary{background:#0f4a43;color:#fff;border-color:#0f4a43}


/* V24 data integrity and save safety */
.save-busy{opacity:.65;pointer-events:none}
.freshness-warning{border:1px solid #e1c987;border-left:4px solid #b78625;border-radius:5px;background:#fbf7e9;padding:11px;margin-top:9px}
.freshness-good{border:1px solid #b7d0ca;border-left:4px solid #0f4a43;border-radius:5px;background:#eef5f3;padding:11px;margin-top:9px}
.import-summary-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.import-summary-grid div{background:#fff;border:1px solid #dedbd3;border-radius:5px;padding:10px}
.import-summary-grid b{display:block;font-size:20px}.import-summary-grid small{display:block;color:#646363;margin-top:3px}


/* V25 period comparison + cleaner closing */
.period-compare{display:grid;gap:8px}
.period-compare-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;border-bottom:1px solid #e4e2dc;padding:10px 0}
.period-compare-row:last-child{border-bottom:0}
.period-compare-row b{font-size:13px}
.period-compare-value{text-align:right;font-weight:900;min-width:54px}
.period-change{font-size:11px;font-weight:900;border-radius:999px;padding:5px 7px;background:#ecece8}
.period-change.up{background:#e4f1eb;color:#246243}.period-change.down{background:#f6e6e6;color:#9a3338}
.close-summary{border:1px solid #d7d4cc;border-radius:5px;background:#f7f7f4;padding:11px;margin-top:10px}
.close-summary b{display:block}.close-summary small{display:block;color:#646363;margin-top:3px}


/* V26 runtime resilience */
.app-error{border:1px solid #e0b7b7;border-left:5px solid #b31f28;border-radius:6px;background:#fff4f4;padding:14px;margin:12px 0}
.app-error b{display:block}.app-error small{display:block;color:#6b4d4d;margin-top:4px}

/* V27 tracked surveys + end-of-day review */
.survey-status-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.survey-status-card{border:1px solid #d7d4cc;border-radius:5px;background:#fff;padding:11px;text-align:center}
.survey-status-card b{display:block;font-size:22px}.survey-status-card small{display:block;color:#646363;margin-top:4px}
.survey-list-item{border:1px solid #d7d4cc;border-radius:5px;background:#fff;padding:12px;margin-top:8px}
.eod-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #e4e2dc}
.eod-row:last-child{border-bottom:0}.eod-row b{display:block}.eod-row small{display:block;color:#646363;margin-top:3px}
/* V28 conversion reporting + leaderboard */
.leaderboard{display:grid;gap:8px}
.leader-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid #ddd9d1;border-radius:6px;background:#fff;padding:11px}
.leader-rank{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#edf2f0;font-weight:900}
.leader-row b{display:block}.leader-row small{display:block;color:#646363;margin-top:3px}
.conversion-strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.conversion-strip>div{border:1px solid #ddd9d1;border-radius:5px;background:#fff;padding:10px;text-align:center}
.conversion-strip b{display:block;font-size:22px}.conversion-strip small{display:block;color:#646363;margin-top:4px}
.campaign-metric-row{display:grid;grid-template-columns:minmax(0,1fr) repeat(4,auto);gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid #e4e2dc;font-size:12px}
.campaign-metric-row:last-child{border-bottom:0}.campaign-metric-row b{font-size:12px}
/* V29 next-best-action + product gaps */
.next-action-card{border:1px solid #b7d0ca;border-left:5px solid #0f4a43;border-radius:7px;background:#f1f7f5;padding:14px;margin:12px 0}
.next-action-card small{display:block;color:#56706a;font-weight:800;letter-spacing:.04em}
.next-action-card h2{margin:5px 0 3px}.next-action-card p{margin:0;color:#4f5f5b}
.next-action-card .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.next-action-card button{min-height:44px;border-radius:5px;border:1px solid #0f4a43;background:#fff;color:#0f4a43;font-weight:850}
.next-action-card button.primary{background:#0f4a43;color:#fff}
.product-gap-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.product-gap-card{border:1px solid #d7d4cc;border-radius:6px;background:#fff;padding:12px;text-align:left}
.product-gap-card b{display:block;font-size:24px}.product-gap-card span{display:block;font-weight:850;margin-top:5px}.product-gap-card small{display:block;color:#646363;margin-top:4px}
/* V31 actual won values */
.won-actuals{border:1px solid #b7d0ca;border-left:4px solid #0f4a43;border-radius:6px;background:#eef5f3;padding:11px;margin-top:10px}
.won-actuals .lead-form-grid{margin-top:8px}
/* V32 survey controls + forecast */
.survey-edit-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:10px}
.survey-edit-actions button{border:1px solid #d7d4cc;border-radius:4px;background:#fff;padding:9px 6px;font-weight:800;font-size:12px}
.survey-edit-actions button.primary{background:#0f4a43;color:#fff;border-color:#0f4a43}
.forecast-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.forecast-card{border:1px solid #d7d4cc;border-radius:6px;background:#fff;padding:11px}
.forecast-card b{display:block;font-size:22px}.forecast-card small{display:block;color:#646363;margin-top:4px}
.forecast-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid #e4e2dc}
.forecast-row:last-child{border-bottom:0}
/* V33 customer snapshot history */
.snapshot-history{display:grid;gap:8px;margin-top:8px}
.snapshot-history-item{border:1px solid #e0ddd6;border-radius:5px;background:#fff;padding:11px}
.snapshot-history-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin-top:8px}
.snapshot-history-grid div{min-width:0}.snapshot-history-grid small{display:block;color:#646363}.snapshot-history-grid b{display:block;font-size:13px;margin-top:2px}
.movement-up{color:#246243}.movement-down{color:#a02d34}
@media(max-width:430px){.snapshot-history-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* V34 campaign completion */
.campaign-progress{height:7px;background:#e6e4de;border-radius:999px;overflow:hidden;margin-top:8px}
.campaign-progress span{display:block;height:100%;background:#0f4a43}
.campaign-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:9px}
.campaign-kpis div{background:#f5f5f1;border-radius:4px;padding:8px;text-align:center}
.campaign-kpis b{display:block;font-size:15px}.campaign-kpis small{display:block;color:#646363;font-size:10px;margin-top:2px}
@media(max-width:430px){.campaign-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* V35 commercial priority engine */
.priority-reason{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.priority-reason span{font-size:10px;font-weight:850;background:#e6efec;color:#365c54;border-radius:999px;padding:5px 7px}
.priority-score{font-size:12px;font-weight:900;color:#0f4a43}
/* V36 customer product mix */
.product-mix-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}
.product-mix-item{border:1px solid #e0ddd6;border-radius:5px;background:#fff;padding:10px}
.product-mix-item small{display:block;color:#646363}.product-mix-item b{display:block;margin-top:3px}
.product-mix-item.gap{border-left:4px solid #b78625}
/* V37 import diagnostics + pipeline risk */
.import-checks{display:grid;gap:7px;margin-top:10px}
.import-check{border:1px solid #ddd9d1;border-radius:5px;background:#fff;padding:9px 10px}
.import-check b{display:block}.import-check small{display:block;color:#646363;margin-top:3px}
.risk-card{border:1px solid #e0c6c6;border-left:4px solid #a13a3f;border-radius:6px;background:#fff;padding:11px;margin-top:8px}
.risk-card b{display:block}.risk-card small{display:block;color:#646363;margin-top:4px}
.risk-score{font-size:12px;font-weight:900;color:#9a3338}
/* V38 pipeline ageing value + sales cycle */
.ageing-value-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ageing-value-card{border:1px solid #d7d4cc;border-radius:6px;background:#fff;padding:11px}
.ageing-value-card b{display:block;font-size:20px}.ageing-value-card small{display:block;color:#646363;margin-top:4px}
.sales-cycle-strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sales-cycle-strip div{border:1px solid #d7d4cc;border-radius:6px;background:#fff;padding:11px;text-align:center}
.sales-cycle-strip b{display:block;font-size:20px}.sales-cycle-strip small{display:block;color:#646363;margin-top:4px}
/* V39 manager work allocation */
.allocation-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.allocation-summary div{border:1px solid #d7d4cc;border-radius:6px;background:#fff;padding:10px;text-align:center}
.allocation-summary b{display:block;font-size:20px}.allocation-summary small{display:block;color:#646363;margin-top:3px}
.allocation-item{border:1px solid #ddd9d1;border-radius:6px;background:#fff;padding:11px;margin-top:8px}
.allocation-item select{width:100%;margin-top:8px;border:1px solid #d7d4cc;border-radius:5px;padding:10px;background:#fff}

/* V41 simple ring home */
.simple-home{display:grid;gap:14px}
.simple-home-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.simple-home-head h2{margin:0;font-size:24px}
.simple-home-head .sub{margin-top:3px}
.ring-section{background:#fff;border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.ring-section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.ring-section-head h2{font-size:18px}
.ring-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 10px}
.progress-ring-card{text-align:center;min-width:0}
.progress-ring{--p:0;width:108px;height:108px;margin:0 auto;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--brand) calc(var(--p)*1%),#e5e9e7 0);position:relative}
.progress-ring:before{content:"";position:absolute;inset:10px;border-radius:50%;background:#fff}
.progress-ring-inner{position:relative;z-index:1;display:grid;place-items:center;line-height:1.05}
.progress-ring-inner b{font-size:24px}
.progress-ring-inner small{font-size:10px;color:var(--muted);margin-top:3px}
.progress-ring-card>strong{display:block;font-size:13px;margin-top:8px}
.progress-ring-card>small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.progress-ring.complete{background:conic-gradient(var(--green) 100%,#e5e9e7 0)}
.progress-ring.over{box-shadow:0 0 0 4px #e4f3e7}
.home-summary-strip{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:10px 2px 0;font-size:12px;color:var(--muted)}
.home-summary-strip b{color:var(--ink)}
.simple-next{background:#fff;border-radius:18px;padding:16px;box-shadow:var(--shadow);border-left:5px solid var(--brand)}
.simple-next small{display:block;color:var(--muted);font-weight:800;letter-spacing:.04em}
.simple-next h2{font-size:20px;margin:5px 0}
.simple-next p{margin:0;color:var(--muted)}
.simple-next-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.simple-next-tags span{font-size:10px;font-weight:800;background:#edf2f0;color:#456159;border-radius:999px;padding:5px 7px}
.simple-next-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.simple-next-actions button{border:1px solid var(--brand);border-radius:12px;padding:13px 10px;background:#fff;color:var(--brand);font-weight:850}
.simple-next-actions button.primary{background:var(--brand);color:#fff}
.home-complete{background:#eef6f2;border-radius:14px;padding:14px;text-align:center}
.home-complete b{display:block;font-size:18px}.home-complete small{display:block;color:var(--muted);margin-top:3px}
@media(min-width:540px){.ring-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:360px){.progress-ring{width:94px;height:94px}.progress-ring-inner b{font-size:21px}}


/* V43 period target switch */
.period-switch{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:#eef1ef;border-radius:12px;padding:4px;margin:-4px 0 14px}
.period-switch button{border:0;background:transparent;border-radius:9px;padding:9px 8px;font-size:12px;font-weight:850;color:var(--muted)}
.period-switch button.active{background:#fff;color:var(--brand);box-shadow:0 2px 8px rgba(0,0,0,.06)}


/* V44 tappable home rings */
.progress-ring-card[data-ring-action]{cursor:pointer;border:0;background:transparent;padding:0;color:inherit;font:inherit;width:100%}
.progress-ring-card[data-ring-action]:active .progress-ring{transform:scale(.97)}
.progress-ring{transition:transform .12s ease}

  <script>
(async function(){
// Inlined into index.html: the frontend remains a single HTML file.
const cloud={enabled:false,initialising:true,member:null,data:{},baseData:{},revision:0,pending:false,blocked:false,inFlight:null,timer:null,
  banner(message){document.getElementById('cloudStatus').textContent=message;const bar=document.getElementById('cloudSaveBar');if(bar)bar.hidden=message==='All changes saved';},
  download(data,suffix='backup'){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify({app:'HANDSOME BDM',version:1,exportedAt:new Date().toISOString(),data},null,2)],{type:'application/json'}));a.href=url;a.download='bdm-'+suffix+'-'+Date.now()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);},
  get(key,fallback){if(key==='bdm_active_user')return this.member.userId;if(key==='bdm_manager_session')return null;return Object.hasOwn(this.data,key)?structuredClone(this.data[key]):(['bdm_activity','bdm_leads','bdm_snapshots'].includes(key)?[]:fallback);},
  set(key,value){if(['bdm_active_user','bdm_manager_session'].includes(key))return;if(this.blocked)throw Error('Shared saving is paused. Download your pending changes before reloading.');this.data[key]=structuredClone(value);this.pending=true;this.banner('Saving changes…');clearTimeout(this.timer);this.timer=setTimeout(()=>this.flush().catch(()=>{}),200);},
  async request(method='GET',body){const token=await Clerk.session?.getToken();if(!token)throw Error('Your session ended. Download pending changes and sign in again.');const r=await fetch('/api/shared',{method,cache:'no-store',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{})});let json;try{json=await r.json();}catch{throw Error('The server could not confirm your save. Please retry.');}if(!r.ok){const e=Error(json.error||'Shared data request failed');e.status=r.status;throw e;}return json;},
  same(a,b){return JSON.stringify(a)===JSON.stringify(b);},
  recordKey(v){
    if(!v||typeof v!=='object'||Array.isArray(v))return null;
    if(v.id!=null)return 'id:'+String(v.id);
    if(v.reference)return 'ref:'+String(v.customerId||'')+':'+String(v.reference);
    if(v.iso)return 'act:'+String(v.iso)+'|'+String(v.customerId||v.customer||'')+'|'+String(v.type||'')+'|'+String(v.audit?.userId||'');
    if(v.customerId&&v.date&&v.value!=null)return 'tx:'+String(v.customerId)+'|'+String(v.date)+'|'+String(v.value)+'|'+String(v.detail||'');
    if(v.date&&v.filename)return 'snap:'+String(v.date)+'|'+String(v.filename);
    return null;
  },
  mergeValue(base,local,remote,path='data'){
    if(this.same(local,base))return structuredClone(remote);
    if(this.same(remote,base))return structuredClone(local);
    if(this.same(local,remote))return structuredClone(local);
    if(Array.isArray(base)&&Array.isArray(local)&&Array.isArray(remote)){
      const all=[...base,...local,...remote],keys=all.map(v=>this.recordKey(v));
      if(all.length&&keys.every(Boolean)){
        const bm=new Map(base.map(v=>[this.recordKey(v),v])),lm=new Map(local.map(v=>[this.recordKey(v),v])),rm=new Map(remote.map(v=>[this.recordKey(v),v]));
        const order=[...local,...remote].map(v=>this.recordKey(v)),seen=new Set(),out=[];
        for(const key of order){
          if(seen.has(key))continue;seen.add(key);
          const b=bm.get(key),l=lm.get(key),r=rm.get(key);
          if(l===undefined&&r===undefined)continue;
          if(l===undefined){if(b!==undefined&&!this.same(r,b))throw Error('Both users changed '+path+' record '+key);continue;}
          if(r===undefined){if(b!==undefined&&!this.same(l,b))throw Error('Both users changed '+path+' record '+key);continue;}
          out.push(this.mergeValue(b,l,r,path+'['+key+']'));
        }
        return out;
      }
      throw Error('Both users changed '+path+' at the same time');
    }
    if(base&&local&&remote&&typeof base==='object'&&typeof local==='object'&&typeof remote==='object'&&!Array.isArray(base)&&!Array.isArray(local)&&!Array.isArray(remote)){
      const out={};for(const key of new Set([...Object.keys(base),...Object.keys(local),...Object.keys(remote)])){
        const b=base[key],l=local[key],r=remote[key];
        if(l===undefined&&r===undefined)continue;
        if(l===undefined){if(b!==undefined&&!this.same(r,b))throw Error('Both users changed '+path+'.'+key);continue;}
        if(r===undefined){if(b!==undefined&&!this.same(l,b))throw Error('Both users changed '+path+'.'+key);continue;}
        out[key]=this.mergeValue(b,l,r,path+'.'+key);
      }return out;
    }
    throw Error('Both users changed '+path+' at the same time');
  },
  async flush(){if(this.inFlight){await this.inFlight;if(this.pending&&!this.blocked)return this.flush();return;}if(!this.pending||this.blocked)return;const data=structuredClone(this.data);this.pending=false;this.inFlight=(async()=>{try{const saved=await this.request('PUT',{revision:this.revision,data});this.revision=saved.revision;this.baseData=structuredClone(data);this.banner(this.pending?'Saving changes…':'All changes saved');}catch(e){this.pending=true;if(e.status===409){try{const remote=await this.request();const merged=this.mergeValue(this.baseData,data,remote.data);this.baseData=structuredClone(remote.data);this.data=merged;this.revision=remote.revision;this.blocked=false;this.banner('Another user saved first. Merging changes…');return;}catch(conflict){this.blocked=true;this.banner('Save conflict needs review: '+conflict.message);throw conflict;}}if(e.status===403||e.status===401)this.blocked=true;this.banner('Changes NOT saved: '+e.message);throw e;}})();try{await this.inFlight;}finally{this.inFlight=null;}if(this.pending&&!this.blocked)return this.flush();},
  async init(){
    const shell=document.querySelector('.app-shell');shell.hidden=true;
    const gate=document.createElement('section');gate.id='cloudGate';gate.style.cssText='max-width:480px;margin:40px auto;padding:24px';gate.innerHTML='<h1 style="color:#0f4a43">BDM</h1><p id="cloudGateStatus" role="status">Connecting…</p><div id="cloudLogin"></div>';document.body.prepend(gate);
    const status=document.getElementById('cloudGateStatus');
    try{
      const r=await fetch('/api/config',{cache:'no-store'});if(!r.ok)throw Error('Unable to load BDM. Please refresh.');const config=await r.json();
      if(!config.sharedEnabled){shell.hidden=false;gate.remove();return true;}
      this.enabled=true;
      const host=atob(config.publishableKey.split('_').slice(2).join('_').replace(/-/g,'+').replace(/_/g,'/')).replace(/\$$/,'');if(!/^[a-z0-9.-]+$/i.test(host))throw Error('Login is not configured correctly.');
      const script=async(src,attrs={})=>new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.crossOrigin='anonymous';Object.entries(attrs).forEach(([k,v])=>s.setAttribute(k,v));s.onload=resolve;s.onerror=()=>reject(Error('Secure login could not load. Please refresh.'));document.head.append(s);});
      await script('https://'+host+'/npm/@clerk/ui@1/dist/ui.browser.js');await script('https://'+host+'/npm/@clerk/clerk-js@6/dist/clerk.browser.js',{'data-clerk-publishable-key':config.publishableKey});await Clerk.load({ui:{ClerkUI:window.__internal_ClerkUICtor}});
      if(!Clerk.user){status.textContent='Sign in to your depot.';Clerk.mountSignIn(document.getElementById('cloudLogin'),{forceRedirectUrl:location.origin+'/'});return false;}
      const initial=await this.request();this.member=initial.member;this.data=initial.data;this.baseData=structuredClone(initial.data);this.revision=initial.revision;
      if(!this.revision){
        if(!this.member.manager){status.textContent='Your manager needs to import the depot data first.';return false;}
        status.textContent='Choose the depot data to import. A backup downloads before this device’s data is copied.';
        const local={};for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i);if(key.startsWith('bdm_')&&!['bdm_active_user','bdm_manager_session'].includes(key)){try{local[key]=JSON.parse(localStorage.getItem(key));}catch{}}}
        const controls=document.createElement('div');controls.innerHTML='<button id="migrateDevice" class="wide-btn">Import this device’s BDM data</button><p>Or import a BDM backup:</p><input id="migrateFile" type="file" accept=".json,application/json">';gate.append(controls);
        const migrate=async data=>{try{this.download(data,'before-migration');await this.request('PUT',{revision:0,data});location.reload();}catch(e){status.textContent='Import failed: '+e.message;}};
        document.getElementById('migrateDevice').onclick=()=>migrate(local);
        document.getElementById('migrateFile').onchange=async e=>{try{const backup=JSON.parse(await e.target.files[0].text());if(backup.app!=='HANDSOME BDM'||backup.version!==1)throw Error('Choose a supported BDM backup.');await migrate(backup.data);}catch(err){status.textContent=err.message;}};
        return false;
      }
      gate.remove();shell.hidden=false;
      const bar=document.createElement('div');bar.id='cloudSaveBar';bar.hidden=true;bar.style.cssText='background:#fff;padding:12px;border-bottom:1px solid #deded8;position:sticky;top:0;z-index:100';bar.innerHTML='<span id="cloudStatus" role="status">All changes saved</span><div style="display:flex;gap:8px;margin-top:6px"><button id="cloudRetry">Retry save</button><button id="cloudBackup">Download backup</button><button id="cloudReload">Refresh data</button><button id="cloudSignout">Sign out</button></div>';shell.prepend(bar);
      document.getElementById('cloudRetry').onclick=()=>this.flush().catch(()=>{});
      document.getElementById('cloudBackup').onclick=()=>this.download(this.data,this.pending?'unsaved-changes':'backup');
      document.getElementById('cloudReload').onclick=()=>{if(this.pending||this.inFlight){this.download(this.data,'unsaved-changes');if(!confirm('Your pending changes were downloaded. Reload and use the latest shared data?'))return;}location.reload();};
      document.getElementById('cloudSignout').onclick=async()=>{if(this.pending||this.inFlight){this.download(this.data,'unsaved-changes');if(!confirm('Some changes are unsaved. A backup was downloaded. Sign out?'))return;}await Clerk.signOut({redirectUrl:location.origin+'/'});};
      Clerk.addListener(resources=>{if(!resources.session){shell.hidden=true;this.blocked=true;}});
      window.addEventListener('beforeunload',e=>{if(this.pending||this.inFlight){e.preventDefault();e.returnValue='';}});
      setInterval(async()=>{if(this.pending||this.inFlight||this.blocked)return;try{const remote=await this.request();if(remote.revision!==this.revision){this.blocked=true;this.banner('New depot updates available. Refresh data before saving.');}}catch(e){if([401,403].includes(e.status)){shell.hidden=true;this.blocked=true;}else this.banner('Connection interrupted. Retry before making changes.');}},30000);
      return true;
    }catch(e){status.textContent=e.message;return false;}
  }
};

function activeUser(){
  return users.find(u=>u.id===activeUserId && u.active!==false) || null;
}
function syncManagerSession(){
  const u=activeUser(),manager=Boolean(u?.manager&&(!cloud.enabled||cloud.member?.manager));
  document.body.classList.toggle('manager-session',manager);
  const nav=document.getElementById('bottomNav'),managerButton=nav?.querySelector('[data-view="manager"]');
  if(nav){nav.hidden=false;nav.style.gridTemplateColumns=manager?'repeat(5,minmax(0,1fr))':'repeat(4,minmax(0,1fr))';}
  if(managerButton){managerButton.hidden=!manager;managerButton.style.removeProperty('display');}
}
async function sha256(text){
  const data=new TextEncoder().encode(text);
  const digest=await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function auditStamp(user, action){
  const now=new Date();
  return {
    userId:user.id,
    userName:user.name,
    action,
    iso:now.toISOString(),
    display:now.toLocaleString('en-GB',{dateStyle:'medium',timeStyle:'short'})
  };
}

let pendingPinAction=null;
let pinBuffer='';

function refreshPinUsers(selectedId=null){
  const sel=document.getElementById('pinUserSelect');
  if(!sel) return;
  sel.innerHTML=users.filter(u=>u.active!==false).map(u=>`<option value="${u.id}" ${u.id===(selectedId||activeUserId)?'selected':''}>${u.name}${u.manager?' · Manager':''}</option>`).join('');
}
function updatePinDots(){
  document.querySelectorAll('#pinDots span').forEach((d,i)=>d.classList.toggle('filled', i<pinBuffer.length));
}
function closePinModal(){
  pinBuffer='';
  updatePinDots();
  document.getElementById('pinError').textContent='';
  document.getElementById('pinModal').classList.add('hidden');
  document.getElementById('pinModal').setAttribute('aria-hidden','true');
  pendingPinAction=null;
}
function requestPin({title='Confirm save',subtitle='Enter your 4 digit PIN',managerOnly=false,onSuccess}){
  if(cloud.enabled){const user=activeUser();if(cloud.blocked){alert('Refresh shared data before saving. Download any unsaved changes first.');return;}if(!user||(managerOnly&&!cloud.member.manager)){alert('Manager access required.');return;}if(onSuccess)onSuccess(user);return;}

  const available=users.filter(u=>u.active!==false && (!managerOnly || u.manager));
  if(!available.length){
    alert(managerOnly ? 'No active manager user is set up.' : 'No active users are set up.');
    return;
  }
  pendingPinAction={managerOnly,onSuccess};
  pinBuffer='';
  document.getElementById('pinTitle').textContent=title;
  document.getElementById('pinSubtitle').textContent=subtitle;
  document.getElementById('pinError').textContent='';
  refreshPinUsers(available.some(u=>u.id===activeUserId)?activeUserId:available[0].id);
  if(managerOnly){
    document.getElementById('pinUserSelect').innerHTML=available.map(u=>`<option value="${u.id}">${u.name} · Manager</option>`).join('');
  }
  updatePinDots();
  document.getElementById('pinModal').classList.remove('hidden');
  document.getElementById('pinModal').setAttribute('aria-hidden','false');
}
async function submitPinIfReady(){
  if(pinBuffer.length!==4 || !pendingPinAction) return;
  const user=users.find(u=>u.id===document.getElementById('pinUserSelect').value && u.active!==false);
  if(!user){
    document.getElementById('pinError').textContent='Choose an active user.';
    pinBuffer=''; updatePinDots(); return;
  }
  const hash=await sha256(pinBuffer);
  if(hash!==user.pinHash){
    document.getElementById('pinError').textContent='Incorrect PIN';
    pinBuffer=''; updatePinDots(); return;
  }
  if(pendingPinAction.managerOnly && !user.manager){
    document.getElementById('pinError').textContent='Manager permission required';
    pinBuffer=''; updatePinDots(); return;
  }
  const action=pendingPinAction.onSuccess;
  activeUserId=user.id;
  storage.set('bdm_active_user', activeUserId);
  syncManagerSession();
  closePinModal();
  if(action) action(user);
}

  const weekEndISO=`${weekEnd.getFullYear()}-${String(weekEnd.getMonth()+1).padStart(2,'0')}-${String(weekEnd.getDate()).padStart(2,'0')}`;

  });

  let score=0;
  const sales=n(c.salesMAT), rec=n(c.recency), loyalty=n(c.loyalty), tx=n(c.transactionsMAT);
  score += Math.min(30,sales/2000);
  if(rec>=3 && rec<=6) score+=20;
  if(rec>=7 && rec<=11) score+=15;
  if(rec>=12 && rec<=14) score+=10;
  if(loyalty>0 && loyalty<40) score+=10;
  if(loyalty>=70) score+=5;
  if(tx>=10) score+=10;
  if(prev && n(prev.salesMAT)>sales) score+=15;
  return Math.max(0,Math.min(100,Math.round(score)));
}
function bestTimeForCustomer(customerId){
  const acts=activity.filter(a=>a.customerId===customerId && a.iso);
  const byHour={};
  acts.forEach(a=>{
    const hr=new Date(a.iso).getHours();
    if(!byHour[hr]) byHour[hr]={calls:0,success:0};
    byHour[hr].calls++;
    if(a.type==='Spoke to customer'||a.type==='Quote given') byHour[hr].success++;
  });
  const entries=Object.entries(byHour).filter(([,v])=>v.calls>0);
  if(!entries.length) return null;
  entries.sort((a,b)=>{
    const ar=a[1].success/a[1].calls, br=b[1].success/b[1].calls;
    if(br!==ar) return br-ar;
    return b[1].calls-a[1].calls;
  });
  return `${String(entries[0][0]).padStart(2,'0')}:00–${String(Number(entries[0][0])+1).padStart(2,'0')}:00`;
}

function latestSnapshot(){ return snapshots.length ? snapshots[snapshots.length-1] : null; }

function classifyCustomer(c, prevMap){
  const id = String(c.customer ?? '').trim();
  const prev = prevMap ? prevMap[id] : null;
  const rec = n(c.recency);
  const sales = n(c.salesMAT);
  const tx = n(c.transactionsMAT);

  let lifecycle = 'active';
  if (!prev && snapshots.length > 1) lifecycle = 'new';
  if (sales === 0 && tx === 0) lifecycle = 'never';
  if (rec >= 12 && rec <= 14) lifecycle = 'critical';
  else if (rec >= 3 && rec < 12) lifecycle = 'atrisk';

  let movement = {};
  if (prev){
    movement.sales = sales - n(prev.salesMAT);
    movement.transactions = tx - n(prev.transactionsMAT);
  }
  const regularGoneQuiet = !!prev && n(prev.transactionsMAT) >= 10 && rec >= 3 && movement.transactions <= 0;
  return {...c, lifecycle, movement, regularGoneQuiet};
}

function currentCustomerModel(){
  const cur = latestSnapshot();
  if(!cur || !cur.customers.length) return null;

  const prev = snapshots.length > 1 ? snapshots[snapshots.length-2] : null;
  const prevMap = {};
  (prev?.customers || []).forEach(c => prevMap[String(c.customer ?? '').trim()] = c);

  const currentIds = new Set(cur.customers.map(c=>String(c.customer ?? '').trim()));
  const dead = (prev?.customers || []).filter(c => !currentIds.has(String(c.customer ?? '').trim()));

  const enriched = cur.customers.map(c=>classifyCustomer(c, prevMap));
  return {cur, prev, dead, enriched};
}


function customerPriorityTags(c, prev){
  const tags=[];
  const sales=n(c.salesMAT), tx=n(c.transactionsMAT), rec=n(c.recency), loyalty=n(c.loyalty);
  const prevSales=prev ? n(prev.salesMAT) : 0;
  const delta=prev ? sales-prevSales : 0;
  if(rec>=12 && rec<=14) tags.push('critical');
  if(sales===0 && tx===0) tags.push('never');
  if(rec>=12 && sales>0) tags.push('lapsed12');
  if(prev && prevSales>0 && delta<=-(Math.max(1000,prevSales*0.25))) tags.push('spenddrop');
  if(loyalty>0 && loyalty<35) tags.push('lowloyalty');
  if(loyalty>=75) tags.push('highloyalty');
  if(tx===1 && rec>=1) tags.push('oneoff');
  const kitchen=n(c.kitchenNumberMAT), floor=n(c.flooringMAT), joinery=n(c.joineryMAT);
  const productTotal=kitchen+floor+joinery;
  if(productTotal>0){
    if(kitchen/productTotal>=0.6) tags.push('kitchenheavy');
    if(floor/productTotal>=0.6) tags.push('flooringheavy');
    if(joinery/productTotal>=0.6) tags.push('joineryheavy');
  }
  if(!prev && sales===0 && tx===0) tags.push('newnostart');
  if(sales>=20000 && rec>=3) tags.push('highvalueatrisk');
  if(sales>0 && (n(c.appliancesMAT)===0 || n(c.worktopsMAT)===0 || joinery===0)) tags.push('productgap');
  return tags;
}
function priorityRankForCustomer(c, prev){
  const tags=customerPriorityTags(c,prev);
  for(let i=0;i<callPriorityConfig.length;i++){
    if(tags.includes(callPriorityConfig[i].key)) return i;
  }
  return callPriorityConfig.length+1;
}

  }
  const prevMapForPriority={};

  const make = c => {

    const id=String(c.customer||'').trim();
    return {
      id,name:c.name||'Unnamed customer',phone:String(c.phone||c.telephone||'').trim(),months:n(c.recency),

      workflow:wf?.key||null, workflowLabel:wf?.label||null,
      daysOpen:daysOpenForCustomer(c), recentSpend:recentSpend30(id), recentTransactions:recentTxFor(id)
    };
  };
  const ytdTop=top20Customers(), ytdIds=new Set(ytdTop.map(c=>c.customer));
  const mapped=model.enriched.map(c=>{const m=make(c);if(ytdIds.has(m.id)){m.salesYTD=ytdTop.find(t=>t.customer===m.id).salesYTD;}return m;});
  const importedIds=new Set(mapped.map(c=>c.id));
  ytdTop.filter(c=>!importedIds.has(c.customer) && normalContactDue(c.customer)).forEach(c=>mapped.push({id:c.customer,name:c.name||c.customer,phone:'',sales:c.salesYTD,salesLabel:'YTD sales',tx:0,workflow:'top20',workflowLabel:'TOP 20 CUSTOMER · YTD',offer:nurtureSettings.top20Message,lastnote:'From YTD report'}));
  const buckets={top20:[],newNurture:[],oldNurture:[],thanks:[],critical:[],atrisk:[],growth:[],new:[],normal:[]};
  mapped.forEach(m=>{
    if(m.workflow){ buckets[m.workflow].push(m); return; } // suppression: one best action only
    const raw=model.enriched.find(c=>String(c.customer||'').trim()===m.id);
    if(raw?.lifecycle==='critical') buckets.critical.push(m);
    else if(raw?.lifecycle==='atrisk'||raw?.regularGoneQuiet) buckets.atrisk.push(m);
    else if(raw?.lifecycle==='new'||raw?.lifecycle==='never') buckets.new.push(m);
    else if(raw?.lifecycle==='active'&&n(raw.salesMAT)>0) buckets.growth.push(m);
    if(normalContactDue(m.id)) buckets.normal.push(m);
  });
  buckets.top20.sort((a,b)=>ytdTop.findIndex(c=>c.customer===a.id)-ytdTop.findIndex(c=>c.customer===b.id));
  return buckets;
}

async function handleImport(ev){
  const file=ev.target.files[0];
  if(!file) return;
  const status=document.getElementById('importStatus');
  if(typeof XLSX==='undefined'){
    status.innerHTML='<div class="import-status error">Spreadsheet reader did not load. Check your internet connection and try again.</div>';
    return;
  }
  status.innerHTML='<div class="import-status">Reading file…</div>';
  try{
    const buf=await file.arrayBuffer();
    const wb=XLSX.read(buf,{type:'array'});
    const ws=wb.Sheets[wb.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:null,raw:true});
    const customers=[];
    const ytdHeader=rows.slice(0,4).map(row=>(row||[]).findIndex(v=>/ytd|year\s*to\s*date/i.test(String(v||'')) && /sales|spend/i.test(String(v||'')))).find(i=>i>=0);
    for(let i=4;i<rows.length;i++){
      const row=rows[i] || [];
      const id=row[0];
      const name=row[1];
      if((id===null || id==='') && (name===null || name==='')) continue;
      const obj={};
      for(let c=0;c<38;c++) obj[FIELD_NAMES[c]]=row[c] ?? null;
      if(ytdHeader!=null) obj.salesYTD=reportNumber(row[ytdHeader]);
      customers.push(obj);
    }
    const date=document.getElementById('snapshotDate').value || new Date().toISOString().slice(0,10);
    snapshots.push({
      id:Date.now(),
      date,
      filename:file.name,
      sheet:wb.SheetNames[0],
      customers
    });
    storage.set('bdm_snapshots', snapshots);
    status.innerHTML=`<div class="import-status"><b>Imported successfully</b><br>${customers.length} customer rows from "${wb.SheetNames[0]}".</div>`;
    setTimeout(renderImport,700);
  }catch(err){
    status.innerHTML=`<div class="import-status error"><b>Import failed</b><br>${String(err.message || err)}</div>`;
  }
}

function leadStageSummary(list){
  const out={};
  LEAD_STAGES.forEach(s=>out[s]={count:0,value:0,margin:0});
  list.forEach(l=>{
    const s=normalizeStage(l);
    if(!out[s]) out[s]={count:0,value:0,margin:0};
    out[s].count++; out[s].value+=n(l.value); out[s].margin+=n(l.margin);
  });
  return out;
}
function categoryPerformance(category){
  const list=leads.filter(l=>l.category===category);
  const won=list.filter(l=>normalizeStage(l)==='Won');
  const lost=list.filter(l=>normalizeStage(l)==='Lost');
  const decided=won.length+lost.length;
  const avgDaysWon=won.length ? won.reduce((s,l)=>s+leadAgeDays(l),0)/won.length : 0;
  return {
    count:list.length,
    value:list.reduce((s,l)=>s+n(l.value),0),
    margin:list.reduce((s,l)=>s+n(l.margin),0),
    winRate:decided?won.length/decided*100:0,
    avgValue:list.length?list.reduce((s,l)=>s+n(l.value),0)/list.length:0,
    avgDaysWon
  };
}

  const ids=[...new Set(activity.map(a=>a.customerId).filter(Boolean))];

}

    const payload = {

      payload.stage=document.getElementById('leadStage').value||'Quoted';
      payload.value=+document.getElementById('value').value||0;
      payload.margin=+document.getElementById('margin').value||0;
      payload.category=document.getElementById('leadCategory').value||'Kitchen';
      payload.ownerId=document.getElementById('leadOwner').value||activeUserId||'';
      payload.requiredBy=document.getElementById('requiredBy').value||'';
      payload.salesExtras={...readKitchenHandover('quote',payload.category),lossReason:payload.stage==='Lost'?(document.getElementById('quoteLoss')?.value||''):''};

      title:type==='quote'?'Save lead':'Save contact',
      subtitle:`Confirm this update for ${c.name}`,
      onSuccess:(user)=>{

          const mp=payload.value ? (payload.margin/payload.value*100).toFixed(1)+'%' : '—';
          detail=`${payload.quoteDetails||'Quote'} · Quote ${payload.quoteNo||'No number'} · ${money(payload.value)} · ${mp} margin`;
        } else {
          detail=payload.notes || labels[type];
        }

        const audit=auditStamp(user, type==='quote'?'Lead created':labels[type]);
        activity.unshift({
          iso:now.toISOString(),
          time:now.toLocaleString('en-GB',{dateStyle:'medium',timeStyle:'short'}),
          customer:c.name,
          customerId:c.id,
          type:labels[type],
          detail,
          durationMinutes:payload.durationMinutes,
          reasonCode:payload.reasonCode,
          surveyBooked:payload.surveyBooked,
          workflow:c.workflow||null,
          audit
        });
        storage.set('bdm_activity', activity);

        if(type==='quote'){
          leads.unshift({
            id:'L'+Date.now(),
            createdAt:now.toISOString(),
            customer:c.name,
            customerId:c.id,
            ownerId:payload.ownerId || user.id,
            ownerName:(users.find(u=>u.id===(payload.ownerId || user.id))||user).name,
            category:payload.category,
            quoteNo:payload.quoteNo,
            details:payload.quoteDetails,
            value:payload.value,
            margin:payload.margin,
            requiredByDate:payload.requiredBy,
            followUpDate:['Won','Lost'].includes(payload.stage)?'':payload.follow,
            stage:payload.stage,
            status:payload.stage==='Won'?'won':payload.stage==='Lost'?'lost':'open',
            notes:payload.notes,
            ...payload.salesExtras,
            audit
          });
          storage.set('bdm_leads', leads);
        }

        if(type==='contact'){
          const prog=nurtureRecord(c.id);
          if(c.workflow==='newNurture') prog.newContacts=Math.min(4,n(prog.newContacts)+1);
          if(c.workflow==='oldNurture'){ prog.oldContacts=n(prog.oldContacts)+1; prog.lastOldContact=isoToday(); }
          if(c.workflow==='thanks'){
            const latest=(c.recentTransactions||[])[0]?.date;
            if(latest) prog.thanksHandledThrough=latest;
          }
          storage.set('bdm_nurture_progress',nurtureProgress);
        }
        updateTargetHistory(user);
        queueIndex++;
        renderCustomer(type==='quote' ? '✓ Lead recorded' : '✓ Contact recorded');
      }
    });
  };
}




function callAnalytics(){
  const callActs=activity.filter(a=>['Spoke to customer','Voicemail left','No answer','Quote given'].includes(a.type) && a.iso);
  const byDay={}, byHour={}, successByHour={};
  let durationTotal=0,durationCount=0;
  callActs.forEach(a=>{
    const d=new Date(a.iso);
    const day=d.toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'2-digit'});
    const hour=d.getHours();
    byDay[day]=(byDay[day]||0)+1;
    byHour[hour]=(byHour[hour]||0)+1;
    if(a.type==='Spoke to customer'||a.type==='Quote given') successByHour[hour]=(successByHour[hour]||0)+1;
    if(n(a.durationMinutes)>0){durationTotal+=n(a.durationMinutes);durationCount++;}
  });
  return {byDay,byHour,successByHour,avgDuration:durationCount?durationTotal/durationCount:0};
}


function managerInterventions(){
  const today=isoToday(), out=[];
  leads.forEach(l=>{
    if(leadIsClosed(l)) return;
    const age=leadAgeDays(l);
    if(l.followUpDate && l.followUpDate<today) out.push({type:'Overdue lead',text:`${l.customer} · ${l.ownerName||'Unassigned'} · ${money(l.value)}`});
    if(age>28) out.push({type:'Lead 29+ days old',text:`${l.customer} · ${l.ownerName||'Unassigned'} · ${normalizeStage(l)}`});
    if(n(l.value)>=10000 && l.followUpDate && l.followUpDate<today) out.push({type:'High-value overdue lead',text:`${l.customer} · ${money(l.value)} · ${l.ownerName||'Unassigned'} · due ${l.followUpDate}`});
  });
  const m=dashboardMetrics();
  users.filter(u=>u.active!==false).forEach(u=>{
    const overdue=leads.filter(l=>l.ownerId===u.id && !leadIsClosed(l) && l.followUpDate && l.followUpDate<today).length;
    if(overdue>=3) out.push({type:'Staff overdue workload',text:`${u.name} has ${overdue} overdue leads`});
  });
  return out.slice(0,50);
}
