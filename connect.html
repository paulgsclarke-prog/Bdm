<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BDM secure account</title><style>
body{margin:0;background:#f1f1ef;color:#20201e;font:17px system-ui,sans-serif}main{max-width:440px;margin:48px auto;padding:24px}h1{color:#0f4a43}button{background:#0f4a43;color:white;border:0;border-radius:12px;padding:14px 20px;font:inherit}#status{line-height:1.5}#login{margin-top:24px}
</style></head><body><main><h1>BDM</h1><h2>Secure account setup</h2><p id="status" role="status">Loading secure sign-in…</p><div id="login"></div><button id="signout" hidden>Sign out</button></main>
<script>
async function loadScript(src,attributes={}){await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.crossOrigin='anonymous';Object.entries(attributes).forEach(([k,v])=>s.setAttribute(k,v));s.onload=resolve;s.onerror=()=>reject(new Error('Secure sign-in could not load. Please try again.'));document.head.append(s);});}
async function start(){
  const status=document.getElementById('status');
  try{
    const response=await fetch('/api/config',{cache:'no-store'});if(!response.ok)throw new Error('Account setup is unavailable. Please try again later.');
    const {publishableKey}=await response.json();if(!publishableKey)throw new Error('Account setup is not ready yet.');
    const encoded=publishableKey.split('_').slice(2).join('_');
    const host=atob(encoded.replace(/-/g,'+').replace(/_/g,'/')).replace(/\$$/,'');
    if(!/^[a-z0-9.-]+$/i.test(host))throw new Error('Invalid account configuration.');
    await loadScript('https://'+host+'/npm/@clerk/ui@1/dist/ui.browser.js');
    await loadScript('https://'+host+'/npm/@clerk/clerk-js@6/dist/clerk.browser.js',{'data-clerk-publishable-key':publishableKey});
    await Clerk.load({ui:{ClerkUI:window.__internal_ClerkUICtor}});
    if(!Clerk.user){status.textContent='Sign in or create your account. Depot access is granted separately.';Clerk.mountSignIn(document.getElementById('login'),{forceRedirectUrl:location.origin+'/connect.html',signUpForceRedirectUrl:location.origin+'/connect.html'});return;}
    document.getElementById('signout').hidden=false;
    document.getElementById('signout').onclick=()=>Clerk.signOut({redirectUrl:location.origin+'/connect.html'});
    const token=await Clerk.session.getToken();
    const access=await fetch('/api/shared',{headers:{Authorization:'Bearer '+token},cache:'no-store'});
    if(access.status===403){status.textContent='Your account is ready. Ask your depot manager to link your login to your BDM user.';return;}
    if(!access.ok){status.textContent='Your account is ready. Depot setup is still being completed.';return;}
    const {member}=await access.json();status.textContent='Your account is linked to BDM user '+member.userId+'.';
  }catch(e){status.textContent=e.message;}
}
start();
</script></body></html>
